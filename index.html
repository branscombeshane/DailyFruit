  const all = sageImportComputed(sageDateFilter);
  const rows = sageOnlyPurchasedOnDate ? all.filter(r=>r.purchasedOnDate) : all;
  const tableRows = rows.map(r=>`
    <tr>
      <td>${esc(r.itemCode)}</td>
      <td class="num" style="font-weight:${r.purchasedOnDate?'600':'400'};">${r.averageCost!==null?money(r.averageCost):"—"}</td>
      <td class="num">${fmtNum(r.quantityOnHand)}</td>
      <td class="helptext">${esc(r.item)}</td>
    </tr>`).join("");

  return `
    <div class="pagehead">
      <div><h2>Sage CSV</h2><p>Average Cost is pulled from Purchase Costs entries logged on the date selected below; Quantity On Hand is exported as 0. A Product Mix (composite) item's cost is built from its ingredients' costs on that same date instead — see Product Mixes for the full breakdown.</p></div>
      <div class="actions">
        <div class="field" style="min-width:170px;">
          <label>Purchase date</label>
          <input type="date" id="sageDateFilter" value="${esc(sageDateFilter)}">
        </div>
        <label class="btn"><input type="checkbox" id="toggleFilter" ${sageOnlyPurchasedOnDate?"checked":""} style="margin-right:6px;">Only items purchased on this date</label>
        <button class="btn primary" id="downloadSageCsv">Download CSV</button>
      </div>
    </div>
    <div class="card">
      <div class="cardhead"><h3>Export rows</h3><div class="desc">${rows.length} row(s) for ${esc(sageDateFilter||"—")} — matches the "Item Code, Average Cost, Quantity On Hand" import format.</div></div>
      <div class="cardbody" style="padding:0;">
        <div class="tablewrap" style="border:none;border-radius:0;max-height:600px;overflow-y:auto;">
          <table>
            <thead><tr><th>Item code</th><th class="num">Average cost</th><th class="num">Quantity on hand</th><th>Item</th></tr></thead>
            <tbody>${tableRows || `<tr><td colspan="4" class="empty">No purchases logged for this date yet — log one in Purchase Costs.</td></tr>`}</tbody>
          </table>
        </div>
      </div>
    </div>`;
}

// ---------- Stock Take ----------
function renderStockTake(){
  const byCat = {};
  distinctBaseProducts().forEach(bp=>{
    const cat = categoryFor(bp) || "Uncategorized";
    (byCat[cat] = byCat[cat]||[]).push(bp);
  });
  const categories = Object.keys(byCat).sort();
  const catForBp = {};
  categories.forEach(c=> byCat[c].forEach(bp=> catForBp[bp]=c));

  const hasValue = v => v!==undefined && v!==null && v!=="";

  // records already saved for the currently selected stock-take date, keyed by base product
  const takesForDate = {};
  DATA.stockTakes.forEach(r=>{
    if(r.date === stockTakeDate) takesForDate[r.baseProduct] = r.amount;
  });

  const catOptions = categories.map(c=>{
    const bps = byCat[c];
    const entered = bps.filter(bp=>hasValue(takesForDate[bp])).length;
    return `<option value="${esc(c)}" ${c===stockCategoryFilter?"selected":""}>${esc(c)} (${entered}/${bps.length})</option>`;
  }).join("");

  let entryCardHtml = "";
  if(stockCategoryFilter && byCat[stockCategoryFilter]){
    const bps = byCat[stockCategoryFilter].slice().sort();
    const rows = bps.map(bp=>{
      const val = takesForDate[bp];
      return `<tr>
        <td>${esc(bp)}</td>
        <td><input class="rowinput num" data-stock-bp="${esc(bp)}" value="${hasValue(val)?val:""}" placeholder="0" style="max-width:140px;"></td>
      </tr>`;
    }).join("");
    entryCardHtml = `
    <div class="card">
      <div class="cardhead">
        <div><h3>${esc(stockCategoryFilter)} — ${esc(stockTakeDate)}</h3><div class="desc">${bps.length} base product(s) in this category. Enter the stock amount counted on this date, then submit. Already-entered amounts are editable — correct and resubmit if needed.</div></div>
        <button class="btn primary" id="submitStockTake">Submit</button>
      </div>
      <div class="cardbody" style="padding:0;">
        <div class="tablewrap" style="border:none;border-radius:0;">
          <table>
            <thead><tr><th>Base product</th><th class="num">Stock amount</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    </div>`;
  }

  const archiveEntries = DATA.stockTakes.map((r,i)=>({r,i}));
  const distinctArchiveDates = Array.from(new Set(archiveEntries.map(e=>e.r.date))).sort().reverse();
  const archiveDateFilterOptions = `<option value="">All dates</option>` +
    distinctArchiveDates.map(d=>`<option value="${esc(d)}" ${d===stockArchiveDateFilter?"selected":""}>${esc(d)}</option>`).join("");

  const archiveGroupDates = stockArchiveDateFilter ? distinctArchiveDates.filter(d=>d===stockArchiveDateFilter) : distinctArchiveDates;
  const archiveGroupsHtml = archiveGroupDates.map(dateKey=>{
    const group = archiveEntries.filter(e=>e.r.date===dateKey).slice().sort((a,b)=> a.r.baseProduct.localeCompare(b.r.baseProduct));
    const groupRows = group.map(({r,i})=>`
      <tr>
        <td>${esc(r.baseProduct)}</td>
        <td>${esc(catForBp[r.baseProduct]||"Uncategorized")}</td>
        <td class="num">${fmtNum(r.amount,0)}</td>
        <td class="helptext">${esc(r.loggedBy||"—")}</td>
        <td><button class="delbtn" data-del-stocktake="${i}" title="Remove row">✕</button></td>
      </tr>`).join("");
    return `
      <div class="tablewrap" style="border:none;border-radius:0;border-bottom:1px solid var(--line);">
        <table>
          <thead>
            <tr><th colspan="5" style="font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink);">${esc(dateKey)} — ${group.length} ${group.length===1?"entry":"entries"}</th></tr>
            <tr><th>Base product</th><th>Category</th><th class="num">Stock amount</th><th>Logged by</th><th></th></tr>
          </thead>
          <tbody>${groupRows}</tbody>
        </table>
      </div>`;
  }).join("");

  return `
    <div class="pagehead">
      <div><h2>Input Stock Levels</h2><p>Pick the date, choose a category, enter the stock count for each base product, then submit. Every submission is kept in the archive below so you can look back at any previous day.</p></div>
    </div>
    <div class="card">
      <div class="cardhead">
        <div><h3>Stock take date</h3><div class="desc">Entries are saved against this date. Pick an earlier date to review or correct a past stock take.</div></div>
        <div class="field" style="min-width:170px;">
          <label>Date</label>
          <input type="date" id="stockTakeDateInput" value="${esc(stockTakeDate)}">
        </div>
      </div>
    </div>
    <div class="card">
      <div class="cardhead">
        <div><h3>Category</h3><div class="desc">Choose a category to load its base products below.</div></div>
        <div class="field" style="min-width:220px;">
          <label>Category</label>
          <select id="stockCategorySelect">
            <option value="">Select a category…</option>
            ${catOptions}
          </select>
        </div>
      </div>
    </div>
    ${entryCardHtml}
    <div class="card">
      <div class="cardhead">
        <div><h3>Archive</h3><div class="desc">Every stock take submitted, grouped by date.</div></div>
        <div class="field" style="min-width:170px;">
          <label>Filter by date</label>
          <select id="stockArchiveDateFilter">${archiveDateFilterOptions}</select>
        </div>
        <button class="btn" id="downloadStockArchiveCsv" ${archiveGroupDates.length?"":"disabled"}>Export CSV</button>
      </div>
      <div class="cardbody" style="padding:0;">
        ${archiveGroupsHtml || `<div class="empty">No stock takes submitted yet.</div>`}
      </div>
    </div>`;
}

// ---------- Users ----------
function renderUsers(){
  const users = DATA.users || [];
  const roleLabel = {owner:"Owner", procurement:"Procurement", stocktaker:"Stock Taker"};
  const roleOptionsFor = (current)=> ["owner","procurement","stocktaker"].map(r=>
    `<option value="${r}" ${r===current?"selected":""}>${roleLabel[r]}</option>`).join("");

  const rows = users.map((u,i)=>{
    const isSelf = currentUser && currentUser.name===u.name;
    return `
    <tr>
      <td>${esc(u.name)}${isSelf ? ` <span class="helptext">(you)</span>` : ""}</td>
      <td><select class="rowinput" data-idx="${i}" data-field="role">${roleOptionsFor(u.role)}</select></td>
      <td><input class="rowinput num" data-idx="${i}" data-field="pin" value="${esc(u.pin)}" style="max-width:110px;"></td>
      <td><button class="delbtn" data-del-user="${i}" title="Remove user">✕</button></td>
    </tr>`;
  }).join("");

  return `
    <div class="pagehead">
      <div><h2>Users</h2><p>Who can log in, and what they can see. This is a simple access gate for your team, not encrypted security — PINs are stored in this page's own data.</p></div>
    </div>
    <div class="card">
      <div class="cardhead"><div><h3>Add a user</h3></div></div>
      <div class="cardbody">
        <div class="formgrid">
          <div class="field"><label>Name</label><input type="text" id="newUserName" placeholder="e.g. John"></div>
          <div class="field"><label>PIN</label><input type="text" inputmode="numeric" id="newUserPin" placeholder="e.g. 1234"></div>
          <div class="field"><label>Role</label><select id="newUserRole">${roleOptionsFor("procurement")}</select></div>
          <div><button class="btn" id="addUserBtn">Add user</button></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="cardhead">
        <div><h3>Existing users</h3><div class="desc">${users.length} user(s). Edit role or PIN below, then save.</div></div>
        <button class="btn primary" id="saveUsersBtn">Save changes</button>
      </div>
      <div class="cardbody" style="padding:0;">
        <div class="tablewrap" style="border:none;border-radius:0;"><table>
          <thead><tr><th>Name</th><th>Role</th><th class="num">PIN</th><th></th></tr></thead>
          <tbody>${rows || `<tr><td colspan="4" class="empty">No users yet.</td></tr>`}</tbody>
        </table></div>
      </div>
    </div>
    <div class="card">
      <div class="cardhead"><div><h3>What each role can access</h3></div></div>
      <div class="cardbody helptext">
        <strong>Owner</strong> — everything, including Users and Backup &amp; Restore.<br>
        <strong>Procurement</strong> — Quick Buy, Shopping List, Purchase Costs, Stock Take.<br>
        <strong>Stock Taker</strong> — Stock Take, and a read-only Shopping List.
      </div>
    </div>`;
}

// ---------- Backup & Restore ----------
function renderBackup(){
  return `
    <div class="pagehead">
      <div><h2>Backup &amp; Restore</h2><p>Download a full snapshot of everything in this app, and restore from one if you ever need to. Worth doing before any big edit.</p></div>
    </div>
    <div class="card">
      <div class="cardhead">
        <div><h3>Download a backup</h3><div class="desc">Saves every tab's data — sales, item setup, recipes, calculated holdings, purchase costs, categories, stock levels — as one JSON file.</div></div>
      </div>
      <div class="cardbody">
        <button class="btn primary" id="downloadBackup">Download backup (JSON)</button>
      </div>
    </div>
    <div class="card">
      <div class="cardhead">
        <div><h3>Restore from a backup</h3><div class="desc">Replaces everything currently in the app with the contents of the backup file you choose. Use this if an update ever overwrites something.</div></div>
      </div>
      <div class="cardbody">
        <div class="formgrid">
          <div class="field"><label>Backup file</label><input type="file" id="restoreFileInput" accept="application/json,.json"></div>
          <div><button class="btn" id="restoreBackup">Restore from file</button></div>
        </div>
      </div>
    </div>`;
}


function wireTabEvents(){
    if(currentTab==="shoppinglist"){
    document.getElementById("shoppingStatusFilterSel").addEventListener("change", (e)=>{
      shoppingStatusFilter = e.target.value;
      render();
    });
    document.getElementById("shoppingCategoryFilterSel").addEventListener("change", (e)=>{
      shoppingCategoryFilter = e.target.value;
      render();
    });
    document.querySelectorAll("[data-buy-tick]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const container = btn.closest("[data-buy-row]");
        const bp = container.dataset.buyRow;
        const qtyVal = container.querySelector(".buy-qty").value;
        const costVal = container.querySelector(".buy-cost").value;
        if(!costVal){ toast("Enter a price to mark this bought"); return; }
        const today = new Date().toISOString().slice(0,10);
        DATA.purchaseCosts = DATA.purchaseCosts.filter(p=> !(p.baseProduct===bp && p.date===today));
        const entry = {date:today, baseProduct:bp, cost:Number(costVal)};
        if(qtyVal!==""){ entry.qty = Number(qtyVal); }
        if(currentUser) entry.loggedBy = currentUser.name;
        DATA.purchaseCosts.push(entry);
        shoppingBuyEditing.delete(bp);
        persist("Marked " + bp + " as bought");
      });
    });
    document.querySelectorAll("[data-buy-edit]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        shoppingBuyEditing.add(btn.dataset.buyEdit);
        render();
      });
    });
    document.querySelectorAll("[data-buy-cancel]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        shoppingBuyEditing.delete(btn.dataset.buyCancel);
        render();
      });
    });
    document.querySelectorAll("[data-buy-delete]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const bp = btn.dataset.buyDelete;
        const today = new Date().toISOString().slice(0,10);
        DATA.purchaseCosts = DATA.purchaseCosts.filter(p=> !(p.baseProduct===bp && p.date===today));
        shoppingBuyEditing.delete(bp);
        persist("Deleted today's logged purchase for " + bp);
      });
    });
  }

  if(currentTab==="quickbuy"){
    if(!quickBuySelected){
      const searchInput = document.getElementById("quickBuySearchInput");
      if(searchInput){
        searchInput.addEventListener("input", (e)=>{
          quickBuySearch = e.target.value;
          render();
        });
      }
      const categorySel = document.getElementById("quickBuyCategoryFilterSel");
      if(categorySel){
        categorySel.addEventListener("change", (e)=>{
          quickBuyCategoryFilter = e.target.value;
          render();
        });
      }
      document.querySelectorAll("[data-quickbuy-pick]").forEach(b=>{
        b.addEventListener("click", ()=>{
          const bp = b.dataset.quickbuyPick;
          const today = new Date().toISOString().slice(0,10);
          // default to whichever form matches what's already logged for today, else the purchase form
          quickBuyMode = (unableEntryForDate(bp, today) && !purchaseEntryForDate(bp, today)) ? "unable" : "buy";
          quickBuySelected = bp;
          render();
        });
      });
    } else {
      document.getElementById("quickBuyBack").addEventListener("click", ()=>{
        quickBuySelected = null;
        render();
      });
      document.querySelectorAll("[data-quickbuy-setmode]").forEach(b=>{
        b.addEventListener("click", ()=>{
          quickBuyMode = b.dataset.quickbuySetmode;
          render();
        });
      });
      const confirmBtn = document.getElementById("quickBuyConfirm");
      if(confirmBtn){
        confirmBtn.addEventListener("click", ()=>{
          const qtyVal = document.getElementById("quickBuyQty").value;
          const costVal = document.getElementById("quickBuyCost").value;
          if(!costVal){ toast("Enter a price to confirm"); return; }
          const today = new Date().toISOString().slice(0,10);
          const bp = quickBuySelected;
          DATA.purchaseCosts = DATA.purchaseCosts.filter(p=> !(p.baseProduct===bp && p.date===today));
          DATA.purchaseIssues = DATA.purchaseIssues.filter(p=> !(p.baseProduct===bp && p.date===today));
          const entry = {date:today, baseProduct:bp, cost:Number(costVal)};
          if(qtyVal!==""){ entry.qty = Number(qtyVal); }
          if(currentUser) entry.loggedBy = currentUser.name;
          DATA.purchaseCosts.push(entry);
          quickBuySelected = null;
          quickBuySearch = "";
          persist("Logged " + bp);
        });
      }
      const unableBtn = document.getElementById("quickBuyLogUnable");
      if(unableBtn){
        unableBtn.addEventListener("click", ()=>{
          const reason = document.getElementById("quickBuyReason").value.trim();
          if(!reason){ toast("Enter a reason first"); return; }
          const today = new Date().toISOString().slice(0,10);
          const bp = quickBuySelected;
          DATA.purchaseIssues = DATA.purchaseIssues.filter(p=> !(p.baseProduct===bp && p.date===today));
          DATA.purchaseCosts = DATA.purchaseCosts.filter(p=> !(p.baseProduct===bp && p.date===today));
          const entry = {date:today, baseProduct:bp, reason};
          if(currentUser) entry.loggedBy = currentUser.name;
          DATA.purchaseIssues.push(entry);
          quickBuySelected = null;
          quickBuySearch = "";
          persist("Logged " + bp + " as unable to purchase");
        });
      }
    }
    document.querySelectorAll("[data-quickbuy-edit]").forEach(b=>{
      b.addEventListener("click", ()=>{
        const bp = b.dataset.quickbuyEdit;
        const today = new Date().toISOString().slice(0,10);
        quickBuyMode = (unableEntryForDate(bp, today) && !purchaseEntryForDate(bp, today)) ? "unable" : "buy";
        quickBuySelected = bp;
        render();
      });
    });
    document.querySelectorAll("[data-quickbuy-delete]").forEach(b=>{
      b.addEventListener("click", ()=>{
        const bp = b.dataset.quickbuyDelete;
        const today = new Date().toISOString().slice(0,10);
        DATA.purchaseCosts = DATA.purchaseCosts.filter(p=> !(p.baseProduct===bp && p.date===today));
        DATA.purchaseIssues = DATA.purchaseIssues.filter(p=> !(p.baseProduct===bp && p.date===today));
        persist("Deleted today's log entry for " + bp);
      });
    });
  }

  if(currentTab==="dashboard"){
    document.getElementById("savePlanSettings").addEventListener("click", ()=>{
      DATA.procurementPlan.coverMultiplier = Number(document.getElementById("coverMultiplier").value)||1;
      DATA.procurementPlan.safetyBuffer = (Number(document.getElementById("safetyBufferPct").value)||0)/100;
      const hwRaw = Number(document.getElementById("historyWindowDays").value);
      DATA.procurementPlan.historyWindow = (hwRaw>=7) ? Math.round(hwRaw) : 90;
      const critRaw = Number(document.getElementById("shoppingCriticalPct").value);
      const overRaw = Number(document.getElementById("shoppingOverstockPct").value);
      DATA.shoppingList.criticalPct = (critRaw>0 ? critRaw : 25)/100;
      DATA.shoppingList.overstockPct = (overRaw>100 ? overRaw : 150)/100;
      document.querySelectorAll("[data-catbuffer-input]").forEach(inp=>{
        const cat = inp.dataset.catbufferInput;
        const v = inp.value.trim();
        if(v==="") delete DATA.categoryBuffers[cat];
        else DATA.categoryBuffers[cat] = (Number(v)||0)/100;
      });
      // only the currently-visible (category-filtered) rows are in the DOM — untouched products keep
      // whatever override they already had, so filtering the table before saving never wipes the rest.
      document.querySelectorAll("[data-cycle-input]").forEach(inp=>{
        const bp = inp.dataset.cycleInput;
        const v = inp.value.trim();
        if(v==="") delete DATA.productCycles[bp];
        else DATA.productCycles[bp] = Number(v)||1;
      });
      document.querySelectorAll("[data-ceiling-input]").forEach(inp=>{
        const bp = inp.dataset.ceilingInput;
        const v = inp.value.trim();
        if(v==="") delete DATA.productCeilings[bp];
        else DATA.productCeilings[bp] = Number(v)||0;
      });
      persist("Settings saved");
    });
    document.getElementById("dashboardCategoryFilter").addEventListener("change", (e)=>{
      dashboardCategoryFilter = e.target.value;
      render();
    });
    document.querySelectorAll("[data-del-history]").forEach(b=>{
      b.addEventListener("click", ()=>{
        const date = b.dataset.delHistory;
        DATA.salesHistory = DATA.salesHistory.filter(h=>h.date!==date);
        persist("Removed sales history for " + date);
      });
    });
  }

  if(currentTab==="itemsetup"){
    document.getElementById("itemSearchBox").addEventListener("input", (e)=>{ itemSearch = e.target.value; render(); });
    document.getElementById("addItemRow").addEventListener("click", ()=>{
      const text = document.getElementById("newItemText").value.trim();
      if(!text){ toast("Enter an item name first"); return; }
      if(DATA.itemSetup.some(it=>it.item===text)){ toast("That item already exists"); return; }
      const p = parseItem(text);
      DATA.itemSetup.push({item:text, itemCode:p.code, description:p.description, sellingUnit:p.unit, baseProduct:null, procurementUnit:null, conversionFactor:null});
      DATA.itemSetup.sort((a,b)=> a.item.localeCompare(b.item));
      persist("Added " + text);
    });
    document.getElementById("saveItemSetup").addEventListener("click", ()=>{
      // Base Product is listed before Category in each row, so by the time a category
      // input is processed, that row's (possibly just-edited) baseProduct is already current.
      document.querySelectorAll("#main [data-idx]").forEach(inp=>{
        const idx = Number(inp.dataset.idx);
        const field = inp.dataset.field;
        let val = inp.value;
        if(field==="category"){
          const bp = DATA.itemSetup[idx].baseProduct;
          if(bp){
            if(val) DATA.baseProductCategories[bp] = val;
            else delete DATA.baseProductCategories[bp];
          }
          return;
        }
        if(field==="conversionFactor"){ val = val===""? null : Number(val); }
        DATA.itemSetup[idx][field] = val;
      });
      persist("Item Setup saved");
    });
  }

  if(currentTab==="recipes"){
    document.getElementById("addRecipeRow").addEventListener("click", ()=>{
      const comp = document.getElementById("newRecComposite").value.trim();
      const ing = document.getElementById("newRecIngredient").value.trim();
      const pctRaw = document.getElementById("newRecPercent").value;
      const fixedRaw = document.getElementById("newRecFixed").value;
      if(!comp || !ing){ toast("Composite and ingredient are both required"); return; }
      if(!pctRaw && !fixedRaw){ toast("Enter either a % or a fixed qty"); return; }
      DATA.recipes.push({
        compositeItem: comp, ingredientItem: ing,
        percent: pctRaw ? Number(pctRaw)/100 : null,
        fixedQty: fixedRaw ? Number(fixedRaw) : null,
      });
      persist("Product mix line added");
    });
    document.querySelectorAll("[data-del-recipe]").forEach(b=>{
      b.addEventListener("click", ()=>{
        const i = Number(b.dataset.delRecipe);
        DATA.recipes.splice(i,1);
        persist("Product mix line removed");
      });
    });
    document.getElementById("saveRecipes").addEventListener("click", ()=>{
      const rowsByIdx = {};
      document.querySelectorAll("#main [data-recidx]").forEach(inp=>{
        const idx = Number(inp.dataset.recidx);
        if(!rowsByIdx[idx]) rowsByIdx[idx] = {};
        rowsByIdx[idx][inp.dataset.field] = inp.value;
      });
      Object.keys(rowsByIdx).forEach(idxKey=>{
        const idx = Number(idxKey);
        const rec = DATA.recipes[idx];
        if(!rec) return;
        const vals = rowsByIdx[idx];
        rec.compositeItem = (vals.compositeItem||"").trim();
        rec.ingredientItem = (vals.ingredientItem||"").trim();
        const pctRaw = vals.percent;
        const fixedRaw = vals.fixedQty;
        if(pctRaw !== "" && pctRaw !== undefined){
          rec.percent = Number(pctRaw)/100;
          rec.fixedQty = null;
        } else if(fixedRaw !== "" && fixedRaw !== undefined){
          rec.fixedQty = Number(fixedRaw);
          rec.percent = null;
        } else {
          rec.percent = null;
          rec.fixedQty = null;
        }
      });
      persist("Product Mixes saved");
    });
  }

  if(currentTab==="salesdata"){
    document.getElementById("salesUploadDateInput").addEventListener("change", (e)=>{
      salesUploadDate = e.target.value || new Date().toISOString().slice(0,10);
    });
    if(!salesPendingA) wireSalesDropzone("salesA");
    if(!salesPendingB) wireSalesDropzone("salesB");
    document.querySelectorAll("[data-clear-pending]").forEach(b=>{
      b.addEventListener("click", ()=>{
        if(b.dataset.clearPending==="salesA") salesPendingA = null; else salesPendingB = null;
        render();
      });
    });
    const submitBtn = document.getElementById("salesUploadSubmit");
    if(submitBtn) submitBtn.addEventListener("click", submitSalesUpload);
  }

  if(currentTab==="purchase"){
    document.getElementById("purchDraftDate").addEventListener("change", (e)=>{
      purchaseDraftDate = e.target.value;
      render();
    });
    document.getElementById("purchDateFilter").addEventListener("change", (e)=>{
      purchaseDateFilter = e.target.value;
      render();
    });
    document.getElementById("addDraftLine").addEventListener("click", ()=>{
      if(!purchaseDraftDate){ toast("Pick a date first"); return; }
      const bp = document.getElementById("draftLineBase").value.trim();
      const qty = document.getElementById("draftLineQty").value;
      const cost = document.getElementById("draftLineCost").value;
      if(!bp || !cost){ toast("Base product and cost are both required"); return; }
      const line = {baseProduct:bp, cost:Number(cost)};
      if(qty!==""){ line.qty = Number(qty); }
      purchaseDraftLines.push(line);
      render();
    });
    document.querySelectorAll("[data-del-draft]").forEach(b=>{
      b.addEventListener("click", ()=>{
        const i = Number(b.dataset.delDraft);
        purchaseDraftLines.splice(i,1);
        render();
      });
    });
    const clearBtn = document.getElementById("clearPurchaseDraft");
    if(clearBtn){
      clearBtn.addEventListener("click", ()=>{
        purchaseDraftLines = [];
        render();
      });
    }
    const submitBtn = document.getElementById("submitPurchaseBatch");
    if(submitBtn){
      submitBtn.addEventListener("click", ()=>{
        if(!purchaseDraftDate){ toast("Pick a date first"); return; }
        if(!purchaseDraftLines.length){ toast("Add at least one line first"); return; }
        const count = purchaseDraftLines.length;
        const dateSaved = purchaseDraftDate;
        purchaseDraftLines.forEach(l=>{
          const entry = {date:dateSaved, baseProduct:l.baseProduct, cost:l.cost};
          if(l.qty!==undefined) entry.qty = l.qty;
          if(currentUser) entry.loggedBy = currentUser.name;
          DATA.purchaseCosts.push(entry);
        });
        purchaseDraftLines = [];
        persist("Submitted " + count + " purchase" + (count===1?"":"s") + " for " + dateSaved);
      });
    }
    document.querySelectorAll("[data-del-purchase]").forEach(b=>{
      b.addEventListener("click", ()=>{
        const i = Number(b.dataset.delPurchase);
        DATA.purchaseCosts.splice(i,1);
        persist("Purchase entry removed");
      });
    });
  }

  if(currentTab==="sageimport"){
    document.getElementById("sageDateFilter").addEventListener("change", (e)=>{ sageDateFilter = e.target.value; render(); });
    document.getElementById("toggleFilter").addEventListener("change", (e)=>{ sageOnlyPurchasedOnDate = e.target.checked; render(); });
    document.getElementById("downloadSageCsv").addEventListener("click", ()=>{
      const all = sageImportComputed(sageDateFilter);
      const rows = sageOnlyPurchasedOnDate ? all.filter(r=>r.purchasedOnDate) : all;
      if(!rows.length){ toast("Nothing to export yet"); return; }
      const csv = "Item Code,Average Cost,Quantity On Hand\n" + rows.map(r=>[toCsvField(r.itemCode), r.averageCost, r.quantityOnHand].join(",")).join("\n");
      browserDownload("sage_import_"+(sageDateFilter||"all")+".csv", csv, "text/csv");
      toast("Download started");
    });
  }

  if(currentTab==="stocktake"){
    document.getElementById("stockTakeDateInput").addEventListener("change", (e)=>{
      stockTakeDate = e.target.value;
      render();
    });
    document.getElementById("stockCategorySelect").addEventListener("change", (e)=>{
      stockCategoryFilter = e.target.value;
      render();
    });
    const archiveFilterEl = document.getElementById("stockArchiveDateFilter");
    if(archiveFilterEl){
      archiveFilterEl.addEventListener("change", (e)=>{
        stockArchiveDateFilter = e.target.value;
        render();
      });
    }
    const submitStockBtn = document.getElementById("submitStockTake");
    if(submitStockBtn){
      submitStockBtn.addEventListener("click", ()=>{
        if(!stockTakeDate){ toast("Pick a date first"); return; }
        const inputs = document.querySelectorAll("#main [data-stock-bp]");
        let count = 0;
        inputs.forEach(inp=>{
          const bp = inp.dataset.stockBp;
          const val = inp.value;
          // upsert: drop any existing record for this exact (date, baseProduct) pair, then re-add if non-empty
          DATA.stockTakes = DATA.stockTakes.filter(r=> !(r.date===stockTakeDate && r.baseProduct===bp));
          if(val !== ""){
            const entry = {date:stockTakeDate, baseProduct:bp, amount:Number(val)};
            if(currentUser) entry.loggedBy = currentUser.name;
            DATA.stockTakes.push(entry);
            count++;
          }
        });
        persist("Stock take saved for " + stockCategoryFilter + " on " + stockTakeDate + " (" + count + " entered)");
      });
    }
    document.querySelectorAll("[data-del-stocktake]").forEach(b=>{
      b.addEventListener("click", ()=>{
        const i = Number(b.dataset.delStocktake);
        DATA.stockTakes.splice(i,1);
        persist("Stock take entry removed");
      });
    });
    const downloadArchiveBtn = document.getElementById("downloadStockArchiveCsv");
    if(downloadArchiveBtn){
      downloadArchiveBtn.addEventListener("click", ()=>{
        const rows = DATA.stockTakes.filter(r=> !stockArchiveDateFilter || r.date===stockArchiveDateFilter);
        if(!rows.length){ toast("Nothing to export yet"); return; }
        const sorted = rows.slice().sort((a,b)=> b.date.localeCompare(a.date) || a.baseProduct.localeCompare(b.baseProduct));
        const csv = "Date,Base Product,Category,Stock Amount,Logged By\n" + sorted.map(r=>
          [toCsvField(r.date), toCsvField(r.baseProduct), toCsvField(categoryFor(r.baseProduct)||"Uncategorized"), r.amount, toCsvField(r.loggedBy||"")].join(",")
        ).join("\n");
        browserDownload("stock_take_archive_"+(stockArchiveDateFilter||"all")+".csv", csv, "text/csv");
        toast("Download started");
      });
    }
  }

  if(currentTab==="backup"){
    document.getElementById("downloadBackup").addEventListener("click", ()=>{
      const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
      const data = JSON.stringify(DATA, null, 2);
      browserDownload("daily_fruit_backup_"+stamp+".json", data, "application/json");
      toast("Backup downloaded");
    });
    document.getElementById("restoreBackup").addEventListener("click", ()=>{
      const input = document.getElementById("restoreFileInput");
      const file = input.files && input.files[0];
      if(!file){ toast("Choose a backup file first"); return; }
      const reader = new FileReader();
      reader.onload = ()=>{
        let parsed;
        try{ parsed = JSON.parse(reader.result); }
        catch(e){ toast("That file isn't valid JSON"); return; }
        const required = ["salesA","salesB","itemSetup","recipes","procurementPlan","purchaseCosts","baseProductCategories"];
        const missing = required.filter(k=> !(k in parsed));
        if(missing.length){ toast("That file is missing: " + missing.join(", ")); return; }
        DATA = applyDataDefaults(parsed);
        // if the logged-in user doesn't exist (or has a different role) in the restored data, log out rather than keep stale access
        if(currentUser && !DATA.users.some(u=>u.name===currentUser.name && u.role===currentUser.role)){
          currentUser = null;
          try{ sessionStorage.removeItem("dailyFruitUser"); }catch(e){}
        }
        persist("Restored from backup");
      };
      reader.onerror = ()=> toast("Could not read that file");
      reader.readAsText(file);
    });
  }

  if(currentTab==="users"){
    document.getElementById("addUserBtn").addEventListener("click", ()=>{
      const name = document.getElementById("newUserName").value.trim();
      const pin = document.getElementById("newUserPin").value.trim();
      const role = document.getElementById("newUserRole").value;
      if(!name || !pin){ toast("Name and PIN are both required"); return; }
      if((DATA.users||[]).some(u=>u.name.toLowerCase()===name.toLowerCase())){ toast("A user with that name already exists"); return; }
      if(!DATA.users) DATA.users = [];
      DATA.users.push({name, pin, role});
      persist("Added " + name);
    });
    document.getElementById("saveUsersBtn").addEventListener("click", ()=>{
      document.querySelectorAll("#main [data-idx]").forEach(inp=>{
        const idx = Number(inp.dataset.idx);
        const field = inp.dataset.field;
        if(DATA.users[idx]) DATA.users[idx][field] = inp.value;
      });
      // keep this session's own access in sync if its role/pin was just edited
      if(currentUser){
        const stillMe = DATA.users.find(u=>u.name===currentUser.name);
        if(stillMe){
          currentUser.role = stillMe.role;
          try{ sessionStorage.setItem("dailyFruitUser", JSON.stringify(currentUser)); }catch(e){}
        }
      }
      persist("Users updated");
    });
    document.querySelectorAll("[data-del-user]").forEach(b=>{
      b.addEventListener("click", ()=>{
        const i = Number(b.dataset.delUser);
        const removed = DATA.users[i];
        if(currentUser && removed && removed.name===currentUser.name){
          toast("You can't remove the user you're currently logged in as");
          return;
        }
        DATA.users.splice(i,1);
        persist("User removed");
      });
    });
  }

// Both Pyroca and DF Veg must be staged for the report date before Submit commits anything —
// this stops a lone file (or a stale one left over from a previous date) from silently going live
// on its own, and makes the two-company upload an explicit, deliberate action.
function stageSalesCsvRows(rows, entityKey, filename){
  const pending = {filename, rows};
  if(entityKey==="salesA") salesPendingA = pending; else salesPendingB = pending;
  render();
}

function submitSalesUpload(){
  if(!salesPendingA || !salesPendingB){ toast("Both Pyroca and DF Veg need a file staged before you can submit"); return; }
  DATA.salesA = salesPendingA.rows;
  DATA.salesB = salesPendingB.rows;
  const known = new Set(DATA.itemSetup.map(it=>it.item));
  let added = 0;
  const combinedNow = new Set([...DATA.salesA, ...DATA.salesB].map(r=>r.item));
  combinedNow.forEach(item=>{
    if(!known.has(item)){
      const p = parseItem(item);
      DATA.itemSetup.push({item, itemCode:p.code, description:p.description, sellingUnit:p.unit, baseProduct:null, procurementUnit:null, conversionFactor:null});
      known.add(item);
      added++;
    }
  });
  if(added) DATA.itemSetup.sort((a,b)=> a.item.localeCompare(b.item));
  archiveSalesSnapshot(salesUploadDate); // build up the multi-day demand history Calculated Holdings relies on
  const msg = "Item Sales for " + salesUploadDate + " submitted — Pyroca: " + salesPendingA.filename + " (" + salesPendingA.rows.length + "), DF Veg: " + salesPendingB.filename + " (" + salesPendingB.rows.length + ")" + (added ? (", " + added + " new item(s) added to Item Setup") : "");
  salesPendingA = null;
  salesPendingB = null;
  persist(msg);
}

function wireSalesDropzone(entityKey){
  const dz = document.getElementById(entityKey + "Dropzone");
  const input = document.getElementById(entityKey + "FileInput");
  if(!dz || !input) return;
  const handleFile = (file)=>{
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      const rows = parseSalesCsvText(String(reader.result));
      if(!rows.length){ toast("That file has no rows we could read — expected Item, Qty Sold, Total Cost, Total Selling"); return; }
      stageSalesCsvRows(rows, entityKey, file.name);
    };
    reader.onerror = ()=> toast("Could not read that file");
    reader.readAsText(file);
  };
  dz.addEventListener("dragover", (e)=>{ e.preventDefault(); dz.classList.add("dragover"); });
  dz.addEventListener("dragleave", ()=>{ dz.classList.remove("dragover"); });
  dz.addEventListener("drop", (e)=>{
    e.preventDefault();
    dz.classList.remove("dragover");
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    handleFile(file);
  });
  input.addEventListener("change", (e)=>{
    const file = e.target.files && e.target.files[0];
    handleFile(file);
    input.value = ""; // allow re-selecting the same filename later
  });
}

}

async function boot(){
  try{
    DATA = await loadData();
    dataLoaded = true;
    dataLoadError = null;
    // now that real data is in, re-validate the tentatively-restored session: a user removed
    // (or whose role changed) elsewhere since this session logged in shouldn't keep stale access
    if(currentUser && !DATA.users.some(u=>u.name===currentUser.name && u.role===currentUser.role)){
      currentUser = null;
      try{ sessionStorage.removeItem("dailyFruitUser"); }catch(e){}
    }
  }catch(e){
    dataLoadError = (e && e.message) ? e.message : "Unknown error";
  }
  render();
}
boot();
</script>
