// ---------- Purchase Costs ----------
function renderPurchase(){
  const bpSet = distinctBaseProducts();
  // Buying the same base product from two suppliers on the same day is normal now (not a duplicate to
  // flag) — so this list no longer marks repeats within a date, it just shows every line as-is,
  // including which supplier it came from.
  const entries = DATA.purchaseCosts.map((p,i)=>{
    const found = bpSet.includes(p.baseProduct);
    const count = DATA.itemSetup.filter(it=>it.baseProduct===p.baseProduct).length;
    return {p, i, found, count, dateKey: p.date || "(no date)"};
  });

  const distinctDates = Array.from(new Set(entries.map(e=>e.dateKey))).sort().reverse();
  const dateFilterOptions = `<option value="">All dates</option>` +
    distinctDates.map(d=>`<option value="${esc(d)}" ${d===purchaseDateFilter?"selected":""}>${esc(d)}</option>`).join("");

  const groupDates = purchaseDateFilter ? distinctDates.filter(d=>d===purchaseDateFilter) : distinctDates;
  const groupsHtml = groupDates.map(dateKey=>{
    const group = entries.filter(e=>e.dateKey===dateKey);
    const groupRows = group.map(({p,i,found,count})=>{
      const hasQty = p.qty!==undefined && p.qty!==null && p.qty!=="";
      const total = hasQty ? Number(p.qty)*Number(p.cost) : null;
      return `
      <tr>
        <td>${esc(p.baseProduct)}</td>
        <td class="num">${hasQty ? fmtNum(p.qty) : "—"}</td>
        <td class="num">${money(p.cost)}</td>
        <td class="num">${total!==null ? money(total) : "—"}</td>
        <td>${esc(p.supplier||"—")}</td>
        <td>${found?statusChip("OK"):statusChip("NOT FOUND")}</td>
        <td class="num">${count}</td>
        <td class="helptext">${esc(p.loggedBy||"—")}</td>
        <td><button class="delbtn" data-del-purchase="${i}" title="Remove row">✕</button></td>
      </tr>`;
    }).join("");
    return `
      <div class="tablewrap" style="border:none;border-radius:0;border-bottom:1px solid var(--line);">
        <table>
          <thead>
            <tr><th colspan="9" style="font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink);">${esc(dateKey)} — ${group.length} ${group.length===1?"entry":"entries"}</th></tr>
            <tr><th>Base product</th><th class="num">Qty</th><th class="num">Cost / unit</th><th class="num">Total</th><th>Supplier</th><th>Found?</th><th class="num">Item codes affected</th><th>Logged by</th><th></th></tr>
          </thead>
          <tbody>${groupRows}</tbody>
        </table>
      </div>`;
  }).join("");

  const draftRows = purchaseDraftLines.map((l,i)=>{
    const hasQty = l.qty!==undefined && l.qty!==null && l.qty!=="";
    const total = hasQty ? Number(l.qty)*Number(l.cost) : null;
    return `
    <tr>
      <td>${esc(l.baseProduct)}</td>
      <td class="num">${hasQty ? fmtNum(l.qty) : "—"}</td>
      <td class="num">${money(l.cost)}</td>
      <td class="num">${total!==null ? money(total) : "—"}</td>
      <td>${esc(l.supplier||"—")}</td>
      <td><button class="delbtn" data-del-draft="${i}" title="Remove line">✕</button></td>
    </tr>`;
  }).join("");

  return `
    <div class="pagehead">
      <div><h2>Purchase Costs</h2><p>Pick the date you bought stock, add a line for every product you purchased that day, then submit them all together. Buying the same product from more than one supplier on the same day is fine — add a separate line for each.</p></div>
    </div>
    ${datalistOptions("baseProductsDL", distinctBaseProducts())}
    <div class="card">
      <div class="cardhead">
        <div><h3>New purchase entry</h3><div class="desc">Set the date once, add every product bought that day below, then submit as a batch.</div></div>
      </div>
      <div class="cardbody">
        <div class="formgrid" style="margin-bottom:14px;">
          <div class="field"><label>Purchase date</label><input type="date" id="purchDraftDate" value="${esc(purchaseDraftDate)}"></div>
        </div>
        <div class="formgrid">
          <div class="field"><label>Base product</label><input type="text" id="draftLineBase" list="baseProductsDL"></div>
          <div class="field"><label>Quantity</label><input type="number" step="0.01" id="draftLineQty" placeholder="e.g. 10"></div>
          <div class="field"><label>Cost per procurement unit</label><input type="number" step="0.01" id="draftLineCost" placeholder="e.g. 85.00"></div>
          <div class="field"><label>Supplier</label><input type="text" id="draftLineSupplier" placeholder="optional"></div>
          <div><button class="btn" id="addDraftLine">Add line</button></div>
        </div>
        ${purchaseDraftLines.length ? `
        <div class="tablewrap" style="margin-top:14px;"><table>
          <thead><tr><th>Base product</th><th class="num">Qty</th><th class="num">Cost / unit</th><th class="num">Total</th><th>Supplier</th><th></th></tr></thead>
          <tbody>${draftRows}</tbody>
        </table></div>
        <div style="margin-top:14px;display:flex;gap:10px;align-items:center;">
          <button class="btn primary" id="submitPurchaseBatch">Submit ${purchaseDraftLines.length} ${purchaseDraftLines.length===1?"entry":"entries"} for ${esc(purchaseDraftDate||"—")}</button>
          <button class="btn" id="clearPurchaseDraft">Clear</button>
        </div>` : `<div class="empty" style="margin-top:14px;">No lines added yet — add products above, then submit.</div>`}
      </div>

    <div class="card">
      <div class="cardhead">
        <div><h3>Current entries</h3><div class="desc">Multiple lines for the same product on the same day (different suppliers) are expected — remove a line only if it was a mistake.</div></div>

          <label>Filter by date</label>

// ---------- Stock Take ----------
function renderStockTake(){
  const byCat = {};
  distinctBaseProducts().forEach(bp=>{
    const cat = categoryFor(bp) || "Uncategorized";
    (byCat[cat] = byCat[cat]||[]).push(bp);
  });
  const categories = Object.keys(byCat).sort();
  const catForBp = {};
  categories.forEach(c=> byCat[c].forEach(bp=> catForBp[bp]=c));

  const hasValue = v => v!==undefined && v!==null && v!=="";

  // records already saved for the currently selected stock-take date, keyed by base product
  const takesForDate = {};
  DATA.stockTakes.forEach(r=>{
    if(r.date === stockTakeDate) takesForDate[r.baseProduct] = r.amount;
  });

  const catOptions = categories.map(c=>{
    const bps = byCat[c];
    const entered = bps.filter(bp=>hasValue(takesForDate[bp])).length;
    return `<option value="${esc(c)}" ${c===stockCategoryFilter?"selected":""}>${esc(c)} (${entered}/${bps.length})</option>`;
  }).join("");

  let entryCardHtml = "";
  if(stockCategoryFilter && byCat[stockCategoryFilter]){
    const bps = byCat[stockCategoryFilter].slice().sort();
    const rows = bps.map(bp=>{
      const val = takesForDate[bp];
      return `<tr>
        <td>${esc(bp)}</td>
        <td><input class="rowinput num" data-stock-bp="${esc(bp)}" value="${hasValue(val)?val:""}" placeholder="0" style="max-width:140px;"></td>
      </tr>`;
    }).join("");
    entryCardHtml = `
    <div class="card">
      <div class="cardhead">
        <div><h3>${esc(stockCategoryFilter)} — ${esc(stockTakeDate)}</h3><div class="desc">${bps.length} base product(s) in this category. Enter the stock amount counted on this date, then submit. Already-entered amounts are editable — correct and resubmit if needed.</div></div>
        <button class="btn primary" id="submitStockTake">Submit</button>
      </div>
      <div class="cardbody" style="padding:0;">
        <div class="tablewrap" style="border:none;border-radius:0;">
          <table>
            <thead><tr><th>Base product</th><th class="num">Stock amount</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    </div>`;
  }

  const archiveEntries = DATA.stockTakes.map((r,i)=>({r,i}));
  const distinctArchiveDates = Array.from(new Set(archiveEntries.map(e=>e.r.date))).sort().reverse();
  const archiveDateFilterOptions = `<option value="">All dates</option>` +
    distinctArchiveDates.map(d=>`<option value="${esc(d)}" ${d===stockArchiveDateFilter?"selected":""}>${esc(d)}</option>`).join("");

  const archiveGroupDates = stockArchiveDateFilter ? distinctArchiveDates.filter(d=>d===stockArchiveDateFilter) : distinctArchiveDates;
  const archiveGroupsHtml = archiveGroupDates.map(dateKey=>{
    const group = archiveEntries.filter(e=>e.r.date===dateKey).slice().sort((a,b)=> a.r.baseProduct.localeCompare(b.r.baseProduct));
    const groupRows = group.map(({r,i})=>`
      <tr>
        <td>${esc(r.baseProduct)}</td>
        <td>${esc(catForBp[r.baseProduct]||"Uncategorized")}</td>
        <td class="num">${fmtNum(r.amount,0)}</td>
        <td class="helptext">${esc(r.loggedBy||"—")}</td>
        <td><button class="delbtn" data-del-stocktake="${i}" title="Remove row">✕</button></td>
      </tr>`).join("");
    return `
      <div class="tablewrap" style="border:none;border-radius:0;border-bottom:1px solid var(--line);">
        <table>
          <thead>
            <tr><th colspan="5" style="font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink);">${esc(dateKey)} — ${group.length} ${group.length===1?"entry":"entries"}</th></tr>
            <tr><th>Base product</th><th>Category</th><th class="num">Stock amount</th><th>Logged by</th><th></th></tr>
          </thead>
          <tbody>${groupRows}</tbody>
        </table>
      </div>`;
  }).join("");

  return `
    <div class="pagehead">
      <div><h2>Input Stock Levels</h2><p>Pick the date, choose a category, enter the stock count for each base product, then submit. Every submission is kept in the archive below so you can look back at any previous day.</p></div>
    </div>
    <div class="card">
      <div class="cardhead">
        <div><h3>Stock take date</h3><div class="desc">Entries are saved against this date. Pick an earlier date to review or correct a past stock take.</div></div>
        <div class="field" style="min-width:170px;">
          <label>Date</label>
          <input type="date" id="stockTakeDateInput" value="${esc(stockTakeDate)}">
        </div>
      </div>
    </div>
    <div class="card">
      <div class="cardhead">
        <div><h3>Category</h3><div class="desc">Choose a category to load its base products below.</div></div>
        <div class="field" style="min-width:220px;">
          <label>Category</label>
          <select id="stockCategorySelect">
            <option value="">Select a category…</option>
            ${catOptions}
          </select>
        </div>
      </div>
    </div>
    ${entryCardHtml}
    <div class="card">
      <div class="cardhead">
        <div><h3>Archive</h3><div class="desc">Every stock take submitted, grouped by date.</div></div>
        <div class="field" style="min-width:170px;">
          <label>Filter by date</label>
          <select id="stockArchiveDateFilter">${archiveDateFilterOptions}</select>
        </div>
        <button class="btn" id="downloadStockArchiveCsv" ${archiveGroupDates.length?"":"disabled"}>Export CSV</button>
      </div>
      <div class="cardbody" style="padding:0;">
        ${archiveGroupsHtml || `<div class="empty">No stock takes submitted yet.</div>`}
      </div>
    </div>`;
}

function wireTabEvents(){
    if(currentTab==="shoppinglist"){
    document.getElementById("shoppingStatusFilterSel").addEventListener("change", (e)=>{
      shoppingStatusFilter = e.target.value;
      render();
    });
    document.getElementById("shoppingCategoryFilterSel").addEventListener("change", (e)=>{
      shoppingCategoryFilter = e.target.value;
      render();
    });
    document.querySelectorAll("[data-stat-filter]").forEach(el=>{
      el.addEventListener("click", ()=>{
        const status = el.dataset.statFilter;
        shoppingStatusFilter = (shoppingStatusFilter === status) ? "" : status;
        render();
      });
    });
    const boughtTodayTile = document.querySelector("[data-stat-boughttoday]");
    if(boughtTodayTile) boughtTodayTile.addEventListener("click", ()=>{
      shoppingBoughtTodayOnly = !shoppingBoughtTodayOnly;
      render();
    });
    document.querySelectorAll("[data-buy-tick]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const container = btn.closest("[data-buy-row]");
        const bp = container.dataset.buyRow;
        const editId = container.dataset.buyEditid || "";
        const qtyVal = container.querySelector(".buy-qty").value;
        const costVal = container.querySelector(".buy-cost").value;
        const supplierVal = (container.querySelector(".buy-supplier")||{}).value || "";
        if(!costVal){ toast("Enter a price to mark this bought"); return; }
        const today = new Date().toISOString().slice(0,10);
        const id = editId || newId();
        DATA.purchaseCosts = DATA.purchaseCosts.filter(p=> p.id !== id);
        // can't be "unable to purchase" something you're now logging as bought — mirrors what the
        // backend's logPurchase action already does server-side (see handlePurchaseAction_ in Code.gs);
        // without clearing it here too, a stale "Unable: ..." chip would keep showing next to the new
        // purchase until the next full reload
        DATA.purchaseIssues = DATA.purchaseIssues.filter(p=> !(p.baseProduct===bp && p.date===today));
        const entry = {id, date:today, baseProduct:bp, cost:Number(costVal)};
        if(qtyVal!==""){ entry.qty = Number(qtyVal); }
        if(supplierVal.trim()) entry.supplier = supplierVal.trim();
        if(currentUser) entry.loggedBy = currentUser.name;
        DATA.purchaseCosts.push(entry);
        shoppingBuyEditing.delete(bp);
        shoppingIssueEditing.delete(bp);
        // additive on the backend (touches only this one row, matched by its own id) so this can never
        // collide with someone else logging a different purchase — e.g. from Quick Buy — around the
        // same moment, and buying the same product from two suppliers today is just two separate rows
        persistPurchaseAction({action:"logPurchase", entry}, "Marked " + bp + " as bought");
      });
    });
    document.querySelectorAll("[data-buy-addnew]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        shoppingIssueEditing.delete(btn.dataset.buyAddnew); // buying and "unable to buy" are mutually exclusive for the same product/day
        shoppingBuyEditing.set(btn.dataset.buyAddnew, "new");
        render();
      });
    });
    document.querySelectorAll("[data-buy-edit]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        shoppingIssueEditing.delete(btn.dataset.buyEdit);
        shoppingBuyEditing.set(btn.dataset.buyEdit, btn.dataset.buyEditId || "new");
        render();
      });
    });
    document.querySelectorAll("[data-buy-cancel]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        shoppingBuyEditing.delete(btn.dataset.buyCancel);
        render();
      });
    });
    document.querySelectorAll("[data-buy-delete-id]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.dataset.buyDeleteId;
        const bp = btn.dataset.buyDeleteBp;
        DATA.purchaseCosts = DATA.purchaseCosts.filter(p=> p.id !== id);
        shoppingBuyEditing.delete(bp);
        persistPurchaseAction({action:"deletePurchaseLog", id}, "Deleted logged purchase for " + bp);
      });
    });
    // "Unable to purchase" on the Shopping List — mirrors Quick Buy's Unable-to-purchase form, but
    // inline in the Bought-today cell so it's visible (and editable) right from this list too.
    document.querySelectorAll("[data-issue-addnew]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        shoppingBuyEditing.delete(btn.dataset.issueAddnew);
        shoppingIssueEditing.add(btn.dataset.issueAddnew);
        render();
      });
    });
    document.querySelectorAll("[data-issue-edit]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        shoppingBuyEditing.delete(btn.dataset.issueEdit);
        shoppingIssueEditing.add(btn.dataset.issueEdit);
        render();
      });
    });
    document.querySelectorAll("[data-issue-cancel]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        shoppingIssueEditing.delete(btn.dataset.issueCancel);
        render();
      });
    });
    document.querySelectorAll("[data-issue-tick]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const container = btn.closest("[data-issue-row]");
        const bp = container.dataset.issueRow;
        const reason = container.querySelector(".issue-reason").value.trim();
        if(!reason){ toast("Enter a reason first"); return; }
        const today = new Date().toISOString().slice(0,10);
        DATA.purchaseIssues = DATA.purchaseIssues.filter(p=> !(p.baseProduct===bp && p.date===today));
        // can't be "unable to purchase" something already bought (from any supplier) today
        DATA.purchaseCosts = DATA.purchaseCosts.filter(p=> !(p.baseProduct===bp && p.date===today));
        const entry = {date:today, baseProduct:bp, reason};
        if(currentUser) entry.loggedBy = currentUser.name;
        DATA.purchaseIssues.push(entry);
        shoppingIssueEditing.delete(bp);
        shoppingBuyEditing.delete(bp);
        persistPurchaseAction({action:"logPurchaseIssue", entry}, "Logged " + bp + " as unable to purchase");
      });
    });
    document.querySelectorAll("[data-issue-delete]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const bp = btn.dataset.issueDelete;
        const today = new Date().toISOString().slice(0,10);
        DATA.purchaseIssues = DATA.purchaseIssues.filter(p=> !(p.baseProduct===bp && p.date===today));
        shoppingIssueEditing.delete(bp);
        persistPurchaseAction({action:"deletePurchaseIssue", date:today, baseProduct:bp}, "Deleted unable-to-purchase entry for " + bp);
      });
    });
  }

  if(currentTab==="quickbuy"){
    if(!quickBuySelected){
      const searchInput = document.getElementById("quickBuySearchInput");
      if(searchInput){
        searchInput.addEventListener("input", (e)=>{
          quickBuySearch = e.target.value;
          render();
        });
      }
      const categorySel = document.getElementById("quickBuyCategoryFilterSel");
      if(categorySel){
        categorySel.addEventListener("change", (e)=>{
          quickBuyCategoryFilter = e.target.value;
          render();
        });
      }
      document.querySelectorAll("[data-quickbuy-pick]").forEach(b=>{
        b.addEventListener("click", ()=>{
          const bp = b.dataset.quickbuyPick;
          const today = new Date().toISOString().slice(0,10);
          // default to whichever form matches what's already logged for today, else the purchase form;

          DATA.purchaseIssues = DATA.purchaseIssues.filter(p=> !(p.baseProduct===bp && p.date===today));

          // never collide with, wait on, or overwrite whatever the other person is logging right now,

          DATA.purchaseCosts = DATA.purchaseCosts.filter(p=> !(p.baseProduct===bp && p.date===today));
          const entry = {date:today, baseProduct:bp, reason};
          if(currentUser) entry.loggedBy = currentUser.name;
          DATA.purchaseIssues.push(entry);

          quickBuyEditingId = null;

        DATA.itemSetup.forEach(it=>{ if(!it.baseProduct && it.category===oldName) it.category = newName; });
        Object.keys(DATA.baseProductCategories).forEach(bp=>{

        if(DATA.categoryBuffers[oldName]!==undefined){

    // right there in that row so nothing gets typed into fields that don't apply.
    document.querySelectorAll('[data-field="category"][data-idx]').forEach(catInput=>{
      const applyMixState = ()=>{
        const idx = catInput.dataset.idx;
        const isMix = catInput.value.trim().toLowerCase()==="mixes";
        document.querySelectorAll(`[data-idx="${idx}"]`).forEach(sib=>{
          const f = sib.dataset.field;
          if(f==="baseProduct" || f==="procurementUnit" || f==="conversionFactor"){
            sib.disabled = isMix;
            if(isMix) sib.value = "";
          }
        });
      };
      catInput.addEventListener("input", applyMixState);
      applyMixState(); // reflect rows already saved as Mixes as soon as the tab renders
    });
    document.getElementById("saveItemSetup").addEventListener("click", ()=>{
      // Base Product is listed before Category in each row, so by the time a category
      // input is processed, that row's (possibly just-edited) baseProduct is already current.
      document.querySelectorAll("#main [data-idx]").forEach(inp=>{
        const idx = Number(inp.dataset.idx);
        const field = inp.dataset.field;
        let val = inp.value;
        if(field==="category"){
          const val2 = val.trim();
          const bp = DATA.itemSetup[idx].baseProduct;
          if(val2.toLowerCase()==="mixes"){
            // Its own field, not the shared per-Base-Product lookup — a mix has no Base Product to hang it off.
            DATA.itemSetup[idx].category = "Mixes";
          } else if(bp){
            if(val2) DATA.baseProductCategories[bp] = val2;
            else delete DATA.baseProductCategories[bp];
            delete DATA.itemSetup[idx].category; // linked to a real Base Product again — drop any leftover override
          } else {
            if(val2) DATA.itemSetup[idx].category = val2;
            else delete DATA.itemSetup[idx].category;
          }
          return;
        }
        if(field==="conversionFactor"){ val = val===""? null : Number(val); }
        DATA.itemSetup[idx][field] = val;
      });
      // Belt-and-braces: whatever the inputs said, a row categorized as Mixes never keeps a Base
      // Product/Procurement Unit/Conversion Factor — it's assembled from other stock, not bought directly.
      DATA.itemSetup.forEach(it=>{
        if((it.category||"").toLowerCase()==="mixes"){
          it.baseProduct = "";
          it.procurementUnit = "";
          it.conversionFactor = null;
        }
      });
      persist("Item Setup saved", ["itemSetup","baseProductCategories"]);

      const file = input.files && input.files[0];
      if(!file){ toast("Choose a backup file first"); return; }
      const reader = new FileReader();
      reader.onload = ()=>{
        let parsed;
        try{ parsed = JSON.parse(reader.result); }
        catch(e){ toast("That file isn't valid JSON"); return; }
        const required = ["salesA","salesB","itemSetup","recipes","procurementPlan","purchaseCosts","baseProductCategories"];
        const missing = required.filter(k=> !(k in parsed));
        if(missing.length){ toast("That file is missing: " + missing.join(", ")); return; }
        DATA = applyDataDefaults(parsed);
        // A restore is a deliberate "overwrite everything with this file" action — it must never be
        // blocked by the two-tabs-open conflict check just because the backup's own syncVersion (from
        // whenever it was downloaded) doesn't match whatever's current now. Clearing it here is exactly
        // what tells the backend to skip that check for this save (see handleFullSave_ in Code.gs).
        DATA.syncVersion = null;
        // if the logged-in user doesn't exist (or has a different role) in the restored data, log out rather than keep stale access
        if(currentUser && !DATA.users.some(u=>u.name===currentUser.name && u.role===currentUser.role)){
          currentUser = null;
          try{ sessionStorage.removeItem("dailyFruitUser"); }catch(e){}
        }
        persist("Restored from backup");
      };
      reader.onerror = ()=> toast("Could not read that file");
      reader.readAsText(file);
    });
  }

  if(currentTab==="users"){
    document.getElementById("addUserBtn").addEventListener("click", ()=>{
      const name = document.getElementById("newUserName").value.trim();
      const pin = document.getElementById("newUserPin").value.trim();
      const role = document.getElementById("newUserRole").value;
      if(!name || !pin){ toast("Name and PIN are both required"); return; }
      if((DATA.users||[]).some(u=>u.name.toLowerCase()===name.toLowerCase())){ toast("A user with that name already exists"); return; }
      if(!DATA.users) DATA.users = [];
      DATA.users.push({name, pin, role});
      persist("Added " + name, ["users"]);
    });
    document.getElementById("saveUsersBtn").addEventListener("click", ()=>{
      document.querySelectorAll("#main [data-idx]").forEach(inp=>{
        const idx = Number(inp.dataset.idx);
        const field = inp.dataset.field;
        if(DATA.users[idx]) DATA.users[idx][field] = inp.value;
      });
      // keep this session's own access in sync if its role/pin was just edited
      if(currentUser){
        const stillMe = DATA.users.find(u=>u.name===currentUser.name);
        if(stillMe){
          currentUser.role = stillMe.role;
          try{ sessionStorage.setItem("dailyFruitUser", JSON.stringify(currentUser)); }catch(e){}
        }
      }
      persist("Users updated", ["users"]);
    });
    document.querySelectorAll("[data-del-user]").forEach(b=>{
      b.addEventListener("click", ()=>{
        const i = Number(b.dataset.delUser);
        const removed = DATA.users[i];
        if(currentUser && removed && removed.name===currentUser.name){
          toast("You can't remove the user you're currently logged in as");
          return;
        }
        DATA.users.splice(i,1);
        persist("User removed", ["users"]);
      });
    });
  }

// Both Pyroca and DF Veg must be staged for the report date before Submit commits anything —
// this stops a lone file (or a stale one left over from a previous date) from silently going live
// on its own, and makes the two-company upload an explicit, deliberate action.
function stageSalesCsvRows(rows, entityKey, filename){
  const pending = {filename, rows};
  if(entityKey==="salesA") salesPendingA = pending; else salesPendingB = pending;
  render();
}

function submitSalesUpload(){
  if(!salesPendingA || !salesPendingB){ toast("Both Pyroca and DF Veg need a file staged before you can submit"); return; }
  DATA.salesA = salesPendingA.rows;
  DATA.salesB = salesPendingB.rows;
  const known = new Set(DATA.itemSetup.map(it=>it.item));
  let added = 0;
  const combinedNow = new Set([...DATA.salesA, ...DATA.salesB].map(r=>r.item));
  combinedNow.forEach(item=>{
    if(!known.has(item)){
      const p = parseItem(item);
      DATA.itemSetup.push({item, itemCode:p.code, description:p.description, sellingUnit:p.unit, baseProduct:null, procurementUnit:null, conversionFactor:null});
      known.add(item);
      added++;
    }
  });
  if(added) DATA.itemSetup.sort((a,b)=> a.item.localeCompare(b.item));
  archiveSalesSnapshot(salesUploadDate); // build up the multi-day demand history Calculated Holdings relies on
  const msg = "Item Sales for " + salesUploadDate + " submitted — Pyroca: " + salesPendingA.filename + " (" + salesPendingA.rows.length + "), DF Veg: " + salesPendingB.filename + " (" + salesPendingB.rows.length + ")" + (added ? (", " + added + " new item(s) added to Item Setup") : "");
  salesPendingA = null;
  salesPendingB = null;
  persist(msg, ["salesA","salesB","itemSetup","salesHistory"]);
}

function wireSalesDropzone(entityKey){
  const dz = document.getElementById(entityKey + "Dropzone");
  const input = document.getElementById(entityKey + "FileInput");
  if(!dz || !input) return;
  const handleFile = (file)=>{
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      const rows = parseSalesCsvText(String(reader.result));
      if(!rows.length){ toast("That file has no rows we could read — expected Item, Qty Sold, Total Cost, Total Selling"); return; }
      stageSalesCsvRows(rows, entityKey, file.name);
    };
    reader.onerror = ()=> toast("Could not read that file");
    reader.readAsText(file);
  };
  dz.addEventListener("dragover", (e)=>{ e.preventDefault(); dz.classList.add("dragover"); });
  dz.addEventListener("dragleave", ()=>{ dz.classList.remove("dragover"); });
  dz.addEventListener("drop", (e)=>{
    e.preventDefault();
    dz.classList.remove("dragover");
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    handleFile(file);
  });
  input.addEventListener("change", (e)=>{
    const file = e.target.files && e.target.files[0];
    handleFile(file);
    input.value = ""; // allow re-selecting the same filename later
  });
}

}

// Cheap poll: asks the backend for just its current dataVersion (no full readAllData_) and compares
// against what this tab last loaded/saved. Runs on a timer and whenever the tab regains focus or
// visibility — the visibility/focus check is what actually matters for "left it open on my PC, came
// back later", since a background tab's timers get throttled or paused by the browser anyway and
// shouldn't be relied on alone. Never overlaps itself and does nothing until the first load has landed
// and someone's logged in (no point refreshing a login screen).
async function checkForUpdates(){
  if(!dataLoaded || !currentUser || dataRefreshInFlight) return;
  let serverVersion;
  try{
    const res = await fetch(API_URL + "?action=version", {cache: "no-store"});
    if(!res.ok) return;
    const result = await res.json();
    if(!result || !result.ok) return;
    serverVersion = result.dataVersion || null;
  }catch(e){ return; } // offline / a blip — just try again on the next poll, no need to alarm anyone over one failed check

  if(serverVersion === lastKnownDataVersion) return; // still current, including the both-null case (nothing's ever been saved yet)

  if(SAFE_AUTO_REFRESH_TABS.has(currentTab) && !hasUnsavedInlineEdit()){
    // Nothing on this tab can be sitting unsaved in the DOM right now — safe to swap DATA out from
    // under the page and re-render without anyone noticing anything beyond the numbers updating.
    dataRefreshInFlight = true;
    try{
      const fresh = await loadData();
      DATA = fresh;
      lastKnownDataVersion = DATA.dataVersion || null;
      staleDataAvailable = false;
      render();
    }catch(e){
      // leave everything as-is — the next poll will just notice the same staleness and try again
    }
    dataRefreshInFlight = false;
  } else {
    // Either on a tab where a silent swap could wipe unsaved typing, or this safe tab currently has an
    // inline form open — surface the banner instead and let the person choose when to reload.
    showStaleDataBanner();
  }
}

// Deliberately does NOT call the full render() — render() rebuilds the current tab's entire pageHtml
// from DATA, which would blow away exactly the kind of unsaved-but-not-yet-submitted typing (Dashboard
// settings fields, Sage buffer inputs, etc.) that this banner exists to protect in the first place.
// Instead this just splices the banner markup into #main directly, leaving everything else untouched.
// staleDataAvailable is still set so a LATER full render() (e.g. switching tabs) keeps showing it, the
// same way saveConflict already does.
function showStaleDataBanner(){
  staleDataAvailable = true;
  if(saveConflict) return; // the save-conflict banner already covers "something needs your attention"; don't stack a second one on top
  const main = document.getElementById("main");
  if(!main || document.getElementById("staleDataReload")) return; // already showing
  main.insertAdjacentHTML("afterbegin", renderStaleDataBanner());
  const btn = document.getElementById("staleDataReload");
  if(btn) btn.addEventListener("click", ()=> location.reload());
}

async function boot(){
  // paint the loading screen right away — without this, #main stays completely blank for however
  // long the fetch takes (Apps Script's first request after a while can take a few seconds), since
  // otherwise render() isn't called at all until the fetch below has already resolved or failed
  render();
  try{
    DATA = await loadData();
    dataLoaded = true;
    dataLoadError = null;
    lastKnownDataVersion = DATA.dataVersion || null;
    staleDataAvailable = false; // a fresh load is by definition current, even if it was triggered by the "Reload now" button on a stale-data banner
    // now that real data is in, re-validate the tentatively-restored session: a user removed
    // (or whose role changed) elsewhere since this session logged in shouldn't keep stale access
    if(currentUser && !DATA.users.some(u=>u.name===currentUser.name && u.role===currentUser.role)){
      currentUser = null;
      try{ sessionStorage.removeItem("dailyFruitUser"); }catch(e){}
    }
  }catch(e){
    dataLoadError = (e && e.message) ? e.message : "Unknown error";
  }
  render();
}
boot();

// Registered once at script load, not inside boot() — boot() can re-run (the "Try again" button on a
// failed load calls it again), and checkForUpdates() is already a no-op until dataLoaded/currentUser
// are set, so there's no need to guard against double-registration here.
const DATA_POLL_INTERVAL_MS = 90000; // 90s — frequent enough to catch a returning user quickly, cheap enough (one tiny GET) not to matter at any real scale
setInterval(checkForUpdates, DATA_POLL_INTERVAL_MS);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "visible") checkForUpdates(); });
window.addEventListener("focus", checkForUpdates);
</script>
</body>
