<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">DF</div>
      <h1>Daily Fruit</h1>
      <div class="sub">Procurement &amp; costing</div>
    </div>

    <div class="navfoot" id="navFootArea">
      <span class="synctag"><span class="pulse"></span> <span id="syncstate">Synced</span></span>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
// Where the shared data actually lives now: a Google Apps Script Web App backed by a Google
// Sheet (see the setup docs shipped alongside this file). Every device that opens this page
// fetches fresh data from here on load, and every save posts the full current state back here —
// there's no more data baked into this HTML file itself, so this file basically never needs to
// be rebuilt just because the data changed.
const API_URL = "https://script.google.com/macros/s/AKfycbxhLGSHqhvY3XKZFyj7f0hL3yQVEzkL8bB4l33YiwQ2h-2exQ5siR6INPiL79iUY7RZ8Q/exec";

function emptyDataShape(){
  // a complete, always-safe starting shape so nothing crashes while the real fetch is in flight
  return {
    salesA: [], salesB: [], itemSetup: [], recipes: [],
    procurementPlan: {coverMultiplier:1, safetyBuffer:0, historyWindow:30},
    purchaseCosts: [], baseProductCategories: {},
    stockTakes: [], shoppingList: {criticalPct:0.25, overstockPct:1.5},
    users: [{name:"Owner", pin:"1234", role:"owner"}],
    purchaseIssues: [], salesHistory: [],
    categoryBuffers: {}, productCycles: {}, productCeilings: {},
    categories: [], categoryCostBuffers: {},
  };
}

function applyDataDefaults(d){
  // fills in anything an older backup (or an older version of the backend sheet) might be
  // missing, so restoring/loading data from before a given feature existed never crashes
  if(!d.stockTakes) d.stockTakes = []; // backward-compatible default for backups predating Stock Take history
  if(!d.shoppingList) d.shoppingList = {criticalPct:0.25, overstockPct:1.5}; // backward-compatible default for backups predating the Shopping List
  if(d.stockLevels){
    // migrate the earlier undated "current levels only" shape into a dated archive entry, then drop it
    const migrationDate = new Date().toISOString().slice(0,10);
    Object.keys(d.stockLevels).forEach(bp=>{
      const val = d.stockLevels[bp];
      if(val!==null && val!==undefined && val!=="" && !d.stockTakes.some(r=>r.date===migrationDate && r.baseProduct===bp)){
        d.stockTakes.push({date:migrationDate, baseProduct:bp, amount:Number(val)});
      }
    });
    delete d.stockLevels;
  }
  if(Array.isArray(d.itemSetup)){
    // one-time correction: earlier builds appended new items (from sales uploads / manual add)
    // to the end of the list instead of keeping it alphabetical — re-sort once on load, then
    // addItemRow / submitSalesUpload keep it sorted going forward.
    d.itemSetup.sort((a,b)=> (a.item||"").localeCompare(b.item||""));
  }
  if(!d.purchaseIssues) d.purchaseIssues = []; // backward-compatible default for backups predating "Unable to purchase" reasons
  if(!d.salesHistory) d.salesHistory = []; // backward-compatible default for backups predating automatic sales history archiving
  if(!d.categoryBuffers) d.categoryBuffers = {}; // backward-compatible default: per-category safety buffer % overrides (falls back to the global safety buffer when unset)
  if(!d.categoryCostBuffers) d.categoryCostBuffers = {}; // backward-compatible default: per-category cost (wastage) buffer %, Sage CSV only — distinct from categoryBuffers (a demand buffer)
  if(!d.shoppingListSnapshotDates) d.shoppingListSnapshotDates = []; // set by doGet, not saved by the app itself — defaults to empty until the nightly snapshot trigger has run at least once
  if(!d.productCycles) d.productCycles = {}; // backward-compatible default: per-product replenishment cycle length overrides (falls back to the global cover multiplier when unset)
  if(!d.productCeilings) d.productCeilings = {}; // backward-compatible default: per-product shelf-life hold ceilings (no cap when unset)
  if(!d.categories) d.categories = []; // backward-compatible default for backups predating explicit category management (name + hidden flag)
  if(!d.users || !d.users.length){
    // backward-compatible default for backups predating login — logs in as name "Owner", PIN 1234.
    // Change this immediately from the Users tab once logged in.
    d.users = [{name:"Owner", pin:"1234", role:"owner"}];
  }
  if(d.syncVersion===undefined) d.syncVersion = null; // backward-compatible default for backups/backends predating the two-tabs-open safety net
  if(d.dataVersion===undefined) d.dataVersion = null; // backward-compatible default for backups/backends predating the stale-tab refresh check
  return d;
}

function browserDownload(filename, dataStr, mime){
  const blob = new Blob([dataStr], {type: mime || "application/octet-stream"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}

let DATA = emptyDataShape();
let dataLoaded = false;
let dataLoadError = null;
// set when a bulk save (Item Setup / Product Mixes / Settings / Users) is refused because someone
// else saved first — see persist() and handleFullSave_ in Code.gs. Stays set (and the banner stays
// up) across tab switches until the page is reloaded, since that's the only safe way to get back in
// sync — sticking around is the point, a toast would be too easy to miss for this.
let saveConflict = null;
// "Newer data is available" — a DIFFERENT situation from saveConflict above (which means a save WE
// tried was rejected). This means the background staleness poll (see checkForUpdates) noticed the
// backend has moved on since this tab loaded, before we've tried to save anything ourselves. On a
// read-focused tab with nothing unsaved sitting in the DOM (see SAFE_AUTO_REFRESH_TABS) that's handled
// silently — DATA just gets swapped out and re-rendered; this flag and its banner are only for tabs
// where a silent swap could wipe someone's in-progress typing.
let staleDataAvailable = false;
let lastKnownDataVersion = null; // DATA.dataVersion as of this tab's last successful load/refresh/save; compared against the server's on every poll
let dataRefreshInFlight = false; // guards against overlapping silent refreshes if a slow one is still in flight when the next poll fires
// tentatively restored here (before real data has loaded); boot() re-validates it against the
// real DATA.users once the fetch completes, since the empty starting shape above can't tell
// whether this session's user still exists or still has the same role
let currentUser = null;
try{
  const savedUser = sessionStorage.getItem("dailyFruitUser");
  if(savedUser){
    const parsed = JSON.parse(savedUser);
    if(parsed && parsed.name && parsed.role) currentUser = parsed;
  }
}catch(e){ /* storage unavailable */ }
// The login list used to be a tap-a-name-tile picker, which gets bulky once the user list is long —
// replaced with a single name + PIN form. loginNameInput just remembers what was typed so a wrong-PIN
// re-render doesn't make them retype their name too.
let loginNameInput = "";
let loginError = "";
let currentTab = "dashboard";
try{
  const savedTab = localStorage.getItem("dailyFruitCurrentTab");
  if(savedTab) currentTab = savedTab;
}catch(e){ /* storage unavailable in this preview — fall back to default tab */ }
function setCurrentTab(tabId){
  currentTab = tabId;
  try{ localStorage.setItem("dailyFruitCurrentTab", tabId); }catch(e){}
}
let itemSearch = "";
let itemSetupCategoryFilter = "";
let dashboardCategoryFilter = "";
let salesUploadDate = new Date().toISOString().slice(0,10); // date the Item Sales upload covers — defaults to today, change it to backdate historical reports into the sales history archive
let salesPendingA = null; // {filename, rows} staged Pyroca file for the current report date, awaiting Submit
let salesPendingB = null; // {filename, rows} staged DF Veg file for the current report date, awaiting Submit
let sageDateFilter = new Date().toISOString().slice(0,10);
let sageOnlyPurchasedOnDate = true;
let purchaseDraftDate = "";
let purchaseDraftLines = [];
let purchaseDateFilter = "";
let stockCategoryFilter = "";
let stockTakeDate = new Date().toISOString().slice(0,10);
let stockArchiveDateFilter = "";

function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
// A short, good-enough-for-this-app unique id for a purchase line (or any other row that needs one to
// be individually editable/deletable) — never sent to a server that needs global uniqueness guarantees,
// just enough to tell "this one row" apart from every other row a browser might create around the same time.
function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return (s===null||s===undefined) ? "" : String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtNum(n, d){ if(n===null||n===undefined||n==="") return ""; d = d===undefined?2:d; return Number(n).toLocaleString(undefined,{minimumFractionDigits:d, maximumFractionDigits:d}); }
function money(n){ return n===null||n===undefined||n==="" ? "" : "R"+fmtNum(n,2); }

// ---------- parsing helpers (mirrors the workbook's "CODE - Description - UNIT" convention) ----------
function parseItem(item){
  const parts = item.split(" - ").map(p=>p.trim());
  if(parts.length >= 3){
    return {code:parts[0], description:parts.slice(1,-1).join(" - "), unit:parts[parts.length-1]};
  } else if(parts.length === 2){
    return {code:parts[0], description:parts[1], unit:""};
  }
  return {code:item, description:"", unit:""};
}

// ---------- derived computations (mirror the spreadsheet formulas) ----------
function combinedSalesMap(){
  const map = {};
  for(const row of [...DATA.salesA, ...DATA.salesB]){
    if(!row.item) continue;
    if(!map[row.item]) map[row.item] = {qty:0, cost:0, selling:0};
    map[row.item].qty += Number(row.qty)||0;
    map[row.item].cost += Number(row.cost)||0;
    map[row.item].selling += Number(row.selling)||0;
  }
  return map;
}

function recipeDrivenMap(combined){
  const map = {};
  for(const rec of DATA.recipes){
    if(!rec.compositeItem || !rec.ingredientItem) continue;
    const compQty = (combined[rec.compositeItem]||{}).qty || 0;
    const factor = (rec.percent !== null && rec.percent !== undefined && rec.percent !== "") ? Number(rec.percent) : (Number(rec.fixedQty)||0);
    map[rec.ingredientItem] = (map[rec.ingredientItem]||0) + compQty*factor;
  }
  return map;
}

function recipeCompositeTotals(){
  const totals = {};
  for(const rec of DATA.recipes){
    if(!rec.compositeItem) continue;
    if(rec.percent !== null && rec.percent !== undefined && rec.percent !== ""){
      totals[rec.compositeItem] = (totals[rec.compositeItem]||0) + Number(rec.percent);
    }
  }
  return totals;
}

function itemSetupDerived(){
  const combined = combinedSalesMap();
  const recipeDriven = recipeDrivenMap(combined);
  return DATA.itemSetup.map(it=>{
    const c = combined[it.item] || {qty:0,cost:0,selling:0};
    const recQty = recipeDriven[it.item] || 0;
    const conv = (it.conversionFactor===""||it.conversionFactor===null||it.conversionFactor===undefined) ? null : Number(it.conversionFactor);
    const rawNeeded = (conv && conv!==0) ? (c.qty+recQty)/conv : null;
    return Object.assign({}, it, {combinedQty:c.qty, combinedCost:c.cost, combinedSelling:c.selling, recipeQty:recQty, rawNeeded});
  });
}

// ---------- Sales history (multi-day demand archive) ----------
// Every time a sales CSV is ingested (from either company — Pyroca or DF Veg) we archive a dated
// snapshot of per-base-product demand (in procurement units, using whatever conversion factors were
// set up at the time), tagged with the date it was uploaded for (see salesUploadDate) so daily
// uploads — or backdated historical reports — each land on their own day instead of overwriting one
// another. This builds up automatically instead of Calculated Holdings relying on whatever single
// report happens to be loaded right now.
const DEMAND_HISTORY_WINDOW = 30; // fallback default if the owner hasn't set one (see demandHistoryWindow())

// Owner-adjustable on Calculated Holdings: a shorter window adapts faster to a seasonal turn (fresh
// produce demand shifts through the year) at the cost of noisier day-to-day recommendations; a longer
// one smooths things out but takes longer to fully forget an old season's numbers. Falls back to the
// default above for data saved before this setting existed, or if it's ever cleared/invalid.
function demandHistoryWindow(){
  const v = Number(DATA.procurementPlan.historyWindow);
  return (v && v>0) ? Math.round(v) : DEMAND_HISTORY_WINDOW;
}

function currentDemandSnapshot(){
  const derived = itemSetupDerived();
  const byBase = {};
  for(const it of derived){
    if(!it.baseProduct) continue;
    (byBase[it.baseProduct] = byBase[it.baseProduct]||[]).push(it);
  }
  const snap = {};
  for(const baseProduct of Object.keys(byBase)){
    const matches = byBase[baseProduct];
    const hasRaw = matches.some(it=>it.rawNeeded!==null);
    if(!hasRaw) continue; // skip products that don't have a usable conversion factor yet — don't record a misleading 0
    // floor at 0: a heavy-return/credit-note day can make raw sales minus returns net negative for a
    // product, but "demand" can never be meaningfully negative — letting a negative value into the
    // history would drag the mean+stdev estimate down and risk understocking, the opposite of the point
    snap[baseProduct] = Math.max(0, matches.reduce((s,it)=> s + (it.rawNeeded||0), 0));
  }
  return snap;
}

function archiveSalesSnapshot(forDate){
  // one archived entry per tagged date: uploading Pyroca then DF Veg for the same date
  // refreshes that date's entry (using the latest combined view) rather than double-counting it.
  // Pass a past date (via salesUploadDate) to backdate a historical report into the archive.
  const date = forDate || new Date().toISOString().slice(0,10);
  const demand = currentDemandSnapshot();
  const existing = DATA.salesHistory.find(h=>h.date===date);
  if(existing){ existing.demand = demand; }
  else { DATA.salesHistory.push({date, demand}); }
}

function baseProductDemandHistory(baseProduct){
  const points = DATA.salesHistory
    .filter(h => h.demand && Object.prototype.hasOwnProperty.call(h.demand, baseProduct))
    .sort((a,b)=> a.date.localeCompare(b.date))
    .map(h=> h.demand[baseProduct]);
  return points.slice(-demandHistoryWindow());
}

function demandStatsFor(baseProduct, currentRawUnits){
  const hist = baseProductDemandHistory(baseProduct);
  // fall back to the single current-period figure when there's no archived history yet
  // (e.g. right after upgrading, before any upload has been archived).
  const values = hist.length ? hist : (currentRawUnits!==null && currentRawUnits!==undefined ? [currentRawUnits] : []);
  const n = values.length;
  if(!n) return {avg:null, stdev:0, periods:0};
  const avg = values.reduce((s,v)=>s+v,0)/n;
  const variance = n>1 ? values.reduce((s,v)=> s+Math.pow(v-avg,2),0)/(n-1) : 0;
  return {avg, stdev:Math.sqrt(variance), periods:n};
}

// Category safety buffer: owner-set per category, falling back to the global safety buffer when unset.
function categoryBufferFor(categoryKey){
  const key = categoryKey || "Uncategorized";
  const v = DATA.categoryBuffers ? DATA.categoryBuffers[key] : undefined;
  if(v!==undefined && v!==null && v!=="") return Number(v);
  return Number(DATA.procurementPlan.safetyBuffer)||0;
}
// Category COST buffer: an owner-set % markup on top of average cost, to account for wastage/shrink.
// Used only by the Sage CSV export (see applyCostBuffers_/sageImportComputed below) — completely
// separate from categoryBufferFor above, which is a demand/safety-stock buffer for Calculated Holdings.
// Unlike that one, there's no sensible global default here, so an unset category just gets 0%.
function categoryCostBufferFor(categoryKey){
  const key = categoryKey || "Uncategorized";
  const v = DATA.categoryCostBuffers ? DATA.categoryCostBuffers[key] : undefined;
  if(v!==undefined && v!==null && v!=="") return Number(v);
  return 0;
}
// Replenishment cycle length (in archived periods) for a product: how many periods of cover to hold
// before the next restock. Falls back to the global cover multiplier when a product has no override,
// since cycle length varies product to product (some restock weekly, some twice a week).
function cycleFor(baseProduct){
  const v = DATA.productCycles ? DATA.productCycles[baseProduct] : undefined;
  if(v!==undefined && v!==null && v!=="") return Number(v);
  return Number(DATA.procurementPlan.coverMultiplier)||1;
}
// Optional shelf-life ceiling: a hard cap on the recommended hold quantity so a statistically-driven
// buffer never recommends more than the product can safely hold before it spoils.
function ceilingFor(baseProduct){
  const v = DATA.productCeilings ? DATA.productCeilings[baseProduct] : undefined;
  return (v===undefined||v===null||v==="") ? null : Number(v);
}

function procurementPlanComputed(){
  const derived = itemSetupDerived();
  const byBase = {};
  for(const it of derived){
    if(!it.baseProduct) continue;
    (byBase[it.baseProduct] = byBase[it.baseProduct]||[]).push(it);
  }
  // auto-populated: every base product that exists in Item Setup, always — nothing to add/remove manually
  return distinctBaseProducts().map(baseProduct=>{
    const matches = byBase[baseProduct] || [];
    const rawUnits = Math.max(0, matches.reduce((s,it)=> s + (it.rawNeeded||0), 0)); // floor: see currentDemandSnapshot
    const hasRaw = matches.some(it=>it.rawNeeded!==null);
    const category = categoryFor(baseProduct);
    const categoryKey = category || "Uncategorized";
    const stats = demandStatsFor(baseProduct, hasRaw ? rawUnits : null);
    const cm = cycleFor(baseProduct);
    const sb = categoryBufferFor(categoryKey);
    // demand estimate = average per-period demand + one standard deviation of spread across recent
    // periods, so irregular/inconsistent ordering automatically earns a bigger cushion than steady demand does.
    const demandEstimate = stats.avg===null ? null : (stats.avg + stats.stdev);
    let recommended = (demandEstimate!==null) ? Math.ceil(demandEstimate*cm*(1+sb)) : null;
    const ceiling = ceilingFor(baseProduct);
    const cappedByCeiling = (recommended!==null && ceiling!==null && recommended>ceiling);
    if(cappedByCeiling) recommended = ceiling;
    const units = Array.from(new Set(matches.map(it=>it.procurementUnit).filter(Boolean)));
    const procUnit = units[0] || "";
    const consistency = units.length > 1 ? "Check units differ" : "OK";
    const missing = matches.some(it => ((it.combinedQty>0 || it.recipeQty>0) && !it.conversionFactor)) ? "Missing conversion factor" : "OK";
    return {baseProduct, rawUnits, recommended, procUnit, consistency, missing, itemCount:matches.length, category,
      historyPeriods:stats.periods, avgDemand:stats.avg, demandStdev:stats.stdev, cycleUsed:cm, bufferUsed:sb,
      ceiling, cappedByCeiling};
  });
}

function latestStockTakeMap(){
  // most recent stock take entry per base product — ISO (YYYY-MM-DD) dates sort lexicographically,
  // so a plain string comparison is enough to find the latest one.
  const map = {};
  for(const r of DATA.stockTakes){
    if(!r.baseProduct) continue;
    if(!map[r.baseProduct] || r.date > map[r.baseProduct].date){
      map[r.baseProduct] = {amount:Number(r.amount), date:r.date};
    }
  }
  return map;
}


function shoppingListComputed(){
  // compares each base product's most recent stock take against its Calculated Holdings target
  const plan = procurementPlanComputed();
  const stockMap = latestStockTakeMap();
  const critPct = Number(DATA.shoppingList.criticalPct)||0.25;
  const overPct = Number(DATA.shoppingList.overstockPct)||1.5;
  const rows = plan.map(row=>{
    const stockEntry = stockMap[row.baseProduct] || null;
    const currentStock = stockEntry ? stockEntry.amount : null;
    const stockDate = stockEntry ? stockEntry.date : null;
    const recommended = row.recommended;
    let status, toBuy = null, ratio = null;
    if(recommended === null){
      status = "Missing setup"; // no computable holding target yet (e.g. missing conversion factor)
    } else if(recommended === 0){
      status = (currentStock!==null && currentStock>0) ? "Overstocked" : "OK"; // no demand right now
    } else if(currentStock === null){
      status = "No stock take"; // can't compare without a count
    } else {
      ratio = currentStock / recommended;
      if(ratio <= critPct) status = "Critical";
      else if(ratio < 1) status = "Buy";
      else if(ratio >= overPct) status = "Overstocked";
      else status = "OK";
      toBuy = Math.max(0, Math.ceil(recommended - currentStock));
    }
    return Object.assign({}, row, {currentStock, stockDate, status, toBuy, ratio});
  });
  // Sorted by % of stock ascending — lowest stock (0%) at the top, fullest (100%+) at the bottom — so
  // the most urgent restocking is always what you see first. A row with no computable % at all (no
  // stock take yet, or missing setup) can't be placed on that scale, so those sit at the very top,
  // above 0%, since not even knowing the stock level is at least as urgent as being empty.
  rows.sort((a,b)=>{
    const aHas = a.ratio!==null && a.ratio!==undefined;
    const bHas = b.ratio!==null && b.ratio!==undefined;
    if(aHas !== bHas) return aHas ? 1 : -1;
    if(aHas && a.ratio !== b.ratio) return a.ratio - b.ratio;
    return a.baseProduct.localeCompare(b.baseProduct);
  });
  return rows;
}

// Buying the same base product from two different suppliers on the same day is normal (that's the
// whole point of multi-line purchase logging), so "the cost" for a base product on a given day is a
// quantity-weighted average across every line logged for it that day, not just one line's price.
// A line with no qty logged can't be weighted, so it falls back to being the map's answer only when
// nothing else with a qty exists for that base product+date (better than silently dropping it).
function weightedCostMap_(entries){
  const sums = {}; // baseProduct -> {costQty, qty, fallbackCost}
  for(const p of entries){
    if(!p.baseProduct) continue;
    const qty = Number(p.qty)||0;
    const cost = Number(p.cost)||0;
    if(!sums[p.baseProduct]) sums[p.baseProduct] = {costQty:0, qty:0, fallbackCost:cost};
    if(qty>0){ sums[p.baseProduct].costQty += qty*cost; sums[p.baseProduct].qty += qty; }
    else sums[p.baseProduct].fallbackCost = cost; // last qty-less line wins as the fallback, same spirit as the old "latest wins"
  }
  const map = {};
  Object.keys(sums).forEach(bp=>{
    const s = sums[bp];
    map[bp] = round2(s.qty>0 ? s.costQty/s.qty : s.fallbackCost);
  });
  return map;
}

function purchaseCostMap(date){
  // weighted-average cost per base product across every line logged on this exact date;
  // omit the date to weight across every line ever logged, any date.
  const entries = date ? DATA.purchaseCosts.filter(p=> p.date===date) : DATA.purchaseCosts;
  return weightedCostMap_(entries);
}

// All purchase LINES logged for a base product on a given date (there can be more than one — different
// suppliers, different prices — since multi-supplier same-day buying was added).
function purchaseEntriesForDate(baseProduct, date){
  return DATA.purchaseCosts.filter(p=> p.baseProduct===baseProduct && p.date===date);
}

function unableEntryForDate(baseProduct, date){
  return DATA.purchaseIssues.find(p=> p.baseProduct===baseProduct && p.date===date) || null;
}

// The always-current cost per base product — a weighted average across every line sharing the MOST
// RECENT date logged for that base product (previously just grabbed whichever single row was logged
// last; multiple suppliers on the same day needs a genuine weighted average instead of picking one
// arbitrarily). Used to keep a Product Mix's cost current any time an ingredient's price changes — not
// tied to any single day's Sage export.
function latestPurchaseCostMap(){
  const latestDate = {}; // baseProduct -> most recent date seen
  for(const p of DATA.purchaseCosts){
    if(!p.baseProduct) continue;
    if(!latestDate[p.baseProduct] || (p.date||"") >= latestDate[p.baseProduct]) latestDate[p.baseProduct] = p.date||"";
  }
  const entries = DATA.purchaseCosts.filter(p=> p.baseProduct && (p.date||"")===latestDate[p.baseProduct]);
  return weightedCostMap_(entries);
}

// Cost per unit of any Item Setup row, given a base-product cost lookup (either a specific date's
// purchaseCostMap(), or the always-current latestPurchaseCostMap()). Directly-purchased items divide
// their base product's cost by the conversion factor, same as before. A Product Mix (composite) item
// has no purchase cost of its own — instead its cost is the ingredients' costs combined per the recipe
// (% of composite, or a fixed qty per unit), so it automatically reflects the latest ingredient prices
// without needing its own entry. Recurses for a mix-of-mixes; `visiting` guards against a circular
// mix reference. Returns null if the cost can't be fully determined (missing a base cost somewhere
// in the chain), rather than silently under-costing the mix.
function itemCostPerUnit(itemName, pm, visiting){
  visiting = visiting || new Set();
  if(visiting.has(itemName)) return null;
  const it = DATA.itemSetup.find(x=>x.item===itemName);
  if(it && it.baseProduct && it.conversionFactor && it.baseProduct in pm){
    return round2(Number(pm[it.baseProduct])/Number(it.conversionFactor));
  }
  const lines = DATA.recipes.filter(r=> r.compositeItem===itemName && r.ingredientItem);
  if(!lines.length) return null;
  visiting.add(itemName);
  let total = 0;
  for(const rec of lines){
    const factor = (rec.percent!==null && rec.percent!==undefined && rec.percent!=="") ? Number(rec.percent) : (Number(rec.fixedQty)||0);
    const ingCost = itemCostPerUnit(rec.ingredientItem, pm, visiting);
    if(ingCost===null){ visiting.delete(itemName); return null; }
    total += factor*ingCost;
  }
  visiting.delete(itemName);
  return round2(total);
}

// Applies each base product's category cost (wastage) buffer on top of a purchase cost map — Sage CSV
// only. Scaling the base-product costs before they reach itemCostPerUnit means a Product Mix's cost
// automatically inherits its ingredients' buffered costs through that function's existing recursion,
// with no special-casing needed here for composite items.
function applyCostBuffers_(pm){
  const out = {};
  Object.keys(pm).forEach(bp=>{
    const buf = categoryCostBufferFor(categoryFor(bp));
    out[bp] = buf ? round2(pm[bp] * (1 + buf)) : pm[bp];
  });
  return out;
}

function sageImportComputed(date){
  const derived = itemSetupDerived();
  const pm = applyCostBuffers_(purchaseCostMap(date));
  return derived.map(it=>{
    const newCost = itemCostPerUnit(it.item, pm);
    return {
      itemCode: it.itemCode, averageCost: newCost,
      quantityOnHand: 0,
      item: it.item, baseProduct: it.baseProduct, purchasedOnDate: newCost !== null,
    };
  });
}

// Every distinct Product Mix (composite item), with its currently-computed cost per unit — based on
// the latest known cost of each ingredient, not scoped to any one day — plus a breakdown so it's clear
// exactly which ingredient prices it's built from, and a flag when an ingredient has no cost yet.
function compositeMixCosts(){
  const pm = latestPurchaseCostMap();
  const names = Array.from(new Set(DATA.recipes.map(r=>r.compositeItem).filter(Boolean)));
  return names.map(compositeItem=>{
    const lines = DATA.recipes.filter(r=> r.compositeItem===compositeItem && r.ingredientItem);
    const breakdown = lines.map(rec=>{
      const factor = (rec.percent!==null && rec.percent!==undefined && rec.percent!=="") ? Number(rec.percent) : (Number(rec.fixedQty)||0);
      const ingCost = itemCostPerUnit(rec.ingredientItem, pm);
      return {
        ingredientItem: rec.ingredientItem, isPercent: (rec.percent!==null && rec.percent!==undefined && rec.percent!==""),
        factor, ingredientCost: ingCost, contribution: ingCost!==null ? round2(factor*ingCost) : null,
      };
    });
    const complete = breakdown.every(b=> b.contribution!==null);
    const cost = complete ? round2(breakdown.reduce((s,b)=>s+b.contribution,0)) : null;
    return {compositeItem, cost, breakdown, complete};
  });
}

// ---------- persistence ----------
// Fetches the full shared state from the backend. Uses text/plain-free plain GET (no custom
// headers) so this never triggers a CORS preflight against the Apps Script endpoint.
async function loadData(){
  if(!API_URL || API_URL.indexOf("__")===0){
    throw new Error("This copy of the app has no data source configured yet.");
  }
  const res = await fetch(API_URL, {cache: "no-store"});
  if(!res.ok) throw new Error("Server returned " + res.status);
  const fresh = await res.json();
  return applyDataDefaults(fresh);
}

// Fetches one day's archived Shopping List snapshot on demand (see Code.gs's doGet handling of
// ?action=shoppingListSnapshot) — not part of the main data load, since snapshot history can grow to a
// lot of rows over many days and most sessions never open the Archive tab at all. No synchronous
// render() call anywhere in this function on purpose: it's invoked from inside wireTabEvents (which
// runs at the end of every render()), and calling render() again before the first await would re-enter
// render() while the current one is still on the call stack — everything here happens after the await,
// so the eventual render() is always a fresh call, never a nested one.
async function loadShoppingArchive(date){
  try{
    const res = await fetch(API_URL + "?action=shoppingListSnapshot&date=" + encodeURIComponent(date), {cache: "no-store"});
    if(!res.ok) throw new Error("Server returned " + res.status);
    const result = await res.json();
    if(!result.ok) throw new Error(result.error || "Could not load that day's list");
    if(date === shoppingArchiveDate){ shoppingArchiveRows = result.rows || []; shoppingArchiveError = ""; }
  }catch(e){
    if(date === shoppingArchiveDate){ shoppingArchiveError = "Could not load that day's Shopping List — check your connection and try again."; shoppingArchiveRows = []; }
  }
  if(shoppingArchivePending === date) shoppingArchivePending = null;
  render();
}

// Full-object save — used by Item Setup, Product Mixes, Settings, Users, Sales upload, Stock Take,
// and Restore. Sends the WHOLE DATA object; the backend replaces the corresponding sheet(s) from it.
// Fine when one person edits at a time, which is why it carries the version check (see Code.gs's
// handleFullSave_): if someone else saved since this tab loaded, the save is refused rather than
// silently overwriting their change. Quick Buy / Shopping List purchase logging does NOT go through
// this — see persistPurchaseAction below for why.
//
// changedKeys: which top-level DATA fields this particular save actually touched (e.g. ["stockTakes"],
// ["procurementPlan","shoppingList"]) — the backend only rewrites THOSE sheets instead of all of them,
// which is most of what makes saving fast (each sheet rewrite is its own round trip on Google's side;
// skipping the ones nothing changed in is a bigger win than anything about the data size itself).
// Omit it (or pass nothing) for a genuine full save — currently just Restore from backup — where every
// sheet really does need rewriting.
async function persist(successMsg, changedKeys){
  try{
    const payload = changedKeys ? Object.assign({}, DATA, {changedKeys}) : DATA;
    // Content-Type: text/plain keeps this a CORS "simple request" — Apps Script Web Apps don't
    // handle the OPTIONS preflight a real "application/json" content-type would trigger. The
    // backend parses the body as JSON regardless of the header (see Code.gs's doPost).
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify(payload),
    });
    let result = null;
    try{ result = await res.json(); }catch(e){ /* fall through to the failure toast below */ }
    if(res.ok && result && result.ok){
      saveConflict = null;
      if(result.syncVersion) DATA.syncVersion = result.syncVersion; // so this tab's NEXT save compares against its own last write, not the stale one it loaded with
      // this tab's OWN save is also, trivially, the data changing — absorb it here so the next staleness
      // poll doesn't turn around and tell this same tab "newer data is available" about its own write
      if(result.dataVersion){ DATA.dataVersion = result.dataVersion; lastKnownDataVersion = result.dataVersion; }
      toast(successMsg || "Saved");
    } else if(result && result.conflict){
      saveConflict = result.error || "This data changed elsewhere since you loaded it — reload before saving again.";
      toast("Not saved — someone else's changes would be overwritten");
    } else {
      toast("Could not save" + (result && result.error ? (": " + result.error) : "") + " — check your connection and try again");
    }
  }catch(e){
    toast("Could not save — check your connection and try again");
  }
  render();
}

// Purchase logging (Quick Buy, and Shopping List's inline "mark as bought"/delete) — sends just the
// one row being added/changed/removed. The backend touches only that row (see Code.gs's
// handlePurchaseAction_), so two people logging purchases around the same time — e.g. two buyers at
// the market — never overwrite each other and never need to reload. No version check applies here;
// there's nothing for it to conflict with.
async function persistPurchaseAction(payload, successMsg){
  try{
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify(payload),
    });
    let result = null;
    try{ result = await res.json(); }catch(e){ /* fall through to the failure toast below */ }
    if(res.ok && result && result.ok){
      // same reasoning as persist() above — this tab's own purchase log is data changing too, so absorb
      // its new version rather than have the next poll flag this tab's own write back at itself
      if(result.dataVersion){ DATA.dataVersion = result.dataVersion; lastKnownDataVersion = result.dataVersion; }
      toast(successMsg || "Saved");
    } else {
      toast("Could not save" + (result && result.error ? (": " + result.error) : "") + " — check your connection and try again");
    }
  }catch(e){
    toast("Could not save — check your connection and try again");
  }
  render();
}

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove("show"), 2600);
}

function wireLoginEvents(){
  const nameEl = document.getElementById("loginName");
  if(nameEl) nameEl.addEventListener("input", (e)=>{ loginNameInput = e.target.value; });
  const doLogin = ()=>{
    const name = (document.getElementById("loginName")||{}).value || "";
    const pin = (document.getElementById("loginPin")||{}).value || "";
    loginNameInput = name;
    const trimmedName = name.trim();
    if(!trimmedName){ loginError = "Enter your name"; render(); return; }
    const u = (DATA.users||[]).find(x=> String(x.name).toLowerCase() === trimmedName.toLowerCase());
    if(!u){ loginError = "Name not recognized"; render(); return; }
    if(String(u.pin) !== String(pin)){ loginError = "Incorrect PIN"; render(); return; }
    currentUser = {name:u.name, role:u.role};
    try{ sessionStorage.setItem("dailyFruitUser", JSON.stringify(currentUser)); }catch(e){}
    loginNameInput = "";
    loginError = "";
    render();
  };
  const submitBtn = document.getElementById("loginSubmit");
  if(submitBtn) submitBtn.addEventListener("click", doLogin);
  const pinEl = document.getElementById("loginPin");
  if(pinEl) pinEl.addEventListener("keydown", (e)=>{ if(e.key==="Enter") doLogin(); });
  if(nameEl) nameEl.addEventListener("keydown", (e)=>{ if(e.key==="Enter") doLogin(); });
}

function render(){
  // preserve focus + cursor position across the full innerHTML rebuild below, so typing into a
  // live-filtered search box (Item Setup search, Quick Buy search) doesn't drop focus after each keystroke
  const activeEl = document.activeElement;
  const activeId = (activeEl && activeEl.id) ? activeEl.id : null;
  const hasSelectionApi = activeId && typeof activeEl.selectionStart === "number";
  const selStart = hasSelectionApi ? activeEl.selectionStart : null;
  const selEnd = hasSelectionApi ? activeEl.selectionEnd : null;

  const sidebar = document.querySelector(".sidebar");
  if(!dataLoaded){
    if(sidebar) sidebar.style.display = "none";
    renderNav();
    const main = document.getElementById("main");
    main.innerHTML = dataLoadError ? renderLoadError(dataLoadError) : renderLoading();
    const retryBtn = document.getElementById("retryLoadBtn");
    if(retryBtn) retryBtn.addEventListener("click", ()=>{ dataLoadError = null; render(); boot(); });
    return;
  }
  if(!currentUser){
    if(sidebar) sidebar.style.display = "none";
    renderNav();
    const main = document.getElementById("main");
    main.innerHTML = renderLogin();
    wireLoginEvents();
  } else {
    if(sidebar) sidebar.style.display = "";
    if(!roleCanAccessTab(currentUser.role, currentTab)){
      const firstAllowed = TABS.find(t=> roleCanAccessTab(currentUser.role, t.id));
      if(firstAllowed) setCurrentTab(firstAllowed.id);
    }
    renderNav();
    const main = document.getElementById("main");
    let pageHtml = "";
    if(currentTab==="shoppinglist") pageHtml = renderShoppingList();
    else if(currentTab==="quickbuy") pageHtml = renderQuickBuy();
    else if(currentTab==="shoppingarchive") pageHtml = renderShoppingArchive();
    else if(currentTab==="dashboard") pageHtml = renderDashboard();
    else if(currentTab==="itemsetup") pageHtml = renderItemSetup();
    else if(currentTab==="recipes") pageHtml = renderRecipes();
    else if(currentTab==="salesdata") pageHtml = renderSalesData();
    else if(currentTab==="purchase") pageHtml = renderPurchase();
    else if(currentTab==="sageimport") pageHtml = renderSageImport();
    else if(currentTab==="stocktake") pageHtml = renderStockTake();
    else if(currentTab==="users") pageHtml = renderUsers();
    else if(currentTab==="backup") pageHtml = renderBackup();
    // shown above whichever page is current, on every tab, until reloaded — a bulk save (Item Setup /
    // Product Mixes / Settings / Users) can be refused from any of those pages, and this needs to stay
    // visible regardless of which one the user wanders to afterward. saveConflict (an actually-rejected
    // save) takes priority over staleDataAvailable (just a heads-up, nothing lost yet) when somehow both
    // are true at once.
    main.innerHTML = (saveConflict ? renderSaveConflictBanner(saveConflict) : (staleDataAvailable ? renderStaleDataBanner() : "")) + pageHtml;
    wireTabEvents();
    const reloadBtn = document.getElementById("saveConflictReload");
    if(reloadBtn) reloadBtn.addEventListener("click", ()=> location.reload());
    const staleReloadBtn = document.getElementById("staleDataReload");
    if(staleReloadBtn) staleReloadBtn.addEventListener("click", ()=> location.reload());
  }

  if(activeId){
    const restored = document.getElementById(activeId);
    if(restored){
      restored.focus();
      if(selStart!==null && typeof restored.setSelectionRange==="function"){
        try{ restored.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

function distinctBaseProducts(){
  const set = new Set();
  for(const it of DATA.itemSetup) if(it.baseProduct) set.add(it.baseProduct);
  return Array.from(set).sort();
}
function categoryFor(baseProduct){
  if(!baseProduct) return "";
  return DATA.baseProductCategories[baseProduct] || "";
}
// Category is normally shared by every variant of a Base Product (see categoryFor above). A Product
// Mix has no Base Product of its own, so it can't hang its category off that shared lookup — instead
// it keeps its own category directly on the Item Setup row (it.category), set the moment "Mixes" (or
// any other category) is typed into a row that has no Base Product.
function effectiveCategoryFor(it){
  return it.baseProduct ? categoryFor(it.baseProduct) : (it.category || "");
}
function distinctCategories(){
  const set = new Set();
  Object.values(DATA.baseProductCategories).forEach(c=> c && set.add(c));
  DATA.itemSetup.forEach(it=>{ if(!it.baseProduct && it.category) set.add(it.category); });
  set.add("Mixes"); // always offered as a ready-made option for a Product Mix item, even before one's been used
  return Array.from(set).sort();
}

// Every category that exists, whether it's ever had its own DATA.categories entry or not (a lot of
// categories are still just whatever text someone typed into an item, with no entry of their own —
// this merges both worlds into one list so the Manage Categories card can show and edit all of them).
function allCategoriesWithMeta(){
  const names = new Set(distinctCategories());

  return Array.from(names).sort().map(name=>{
    const rec = (DATA.categories||[]).find(c=>c.name===name);
    return {name, hidden: !!(rec && rec.hidden)};

}

function allItemTexts(){

}
function datalistOptions(id, values){
  return `<datalist id="${id}">` + values.map(v=>`<option value="${esc(v)}">`).join("") + `</datalist>`;
}
function chip(text, kind){ return `<span class="chip ${kind}">${esc(text)}</span>`; }
function statusChip(status){
  if(status==="OK") return chip("OK","good");
  if(!status) return "";
  return chip(status,"critical");
}
function shoppingStatusChip(status){
  const kind = {"Critical":"critical","Buy":"warn","OK":"good","Overstocked":"neutral","No stock take":"neutral","Missing setup":"neutral"}[status] || "neutral";
  return chip(status, kind);
}
function csvParseLine(line){
  const out=[]; let cur=""; let inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){ inQ = !inQ; continue; }
    if(ch===',' && !inQ){ out.push(cur); cur=""; continue; }
    cur+=ch;
  }
  out.push(cur);
  return out.map(s=>s.trim());
}
function toCsvField(v){
  v = (v===null||v===undefined) ? "" : String(v);
  if(/[",\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
  return v;
}
// Sage "Sales By Item Report" exports can carry a header row and/or a trailing
// "Grand Total" (or similar) summary row alongside the real item rows.
const SALES_CSV_NON_ITEM_LABELS = new Set(["item","items","total","totals","grand total","sub total","subtotal","sub-total"]);
function parseSalesCsvText(text){
  // one row per item: Item, Qty Sold, Total Cost, Total Selling.
  // tolerates an optional header row and a trailing totals row (both skipped
  // automatically, wherever they fall in the file) and blank lines.
  const rows = [];
  const lines = text.split(/\r?\n/);
  lines.forEach((line, idx)=>{
    if(!line.trim()) return;
    const parts = csvParseLine(line);
    if(parts.length < 4) return;
    const itemLabel = (parts[0]||"").trim();
    if(!itemLabel) return;
    if(SALES_CSV_NON_ITEM_LABELS.has(itemLabel.toLowerCase())) return; // header or totals row, not a real item
    if(idx===0){
      const qtyCell = (parts[1]||"").trim();
      if(qtyCell && isNaN(Number(qtyCell))) return; // fallback: header row with a non-numeric qty column
    }
    rows.push({item:itemLabel, qty:Number(parts[1])||0, cost:Number(parts[2])||0, selling:Number(parts[3])||0});
  });
  return rows;
}

// ---------- Shopping List ----------
// Renders every purchase LINE logged today for this base product as its own chip (buying the same
// product from two suppliers on the same day is normal now, not a duplicate), plus — mirroring Quick
// Buy — the "unable to purchase" reason for today, if one's been logged. For roles that can manage
// purchases this includes Edit/Delete per line, an "Add another" control, and a "Mark unable to buy"
// control. shoppingBuyEditing maps baseProduct -> the id of the purchase line currently being edited
// (or "new" when adding a fresh one); shoppingIssueEditing is the set of baseProducts currently showing
// the inline "unable to purchase" reason input.
function renderBuyCell(r, today){
  const bp = r.baseProduct;
  const entries = purchaseEntriesForDate(bp, today);
  const issue = unableEntryForDate(bp, today);
  const lineLabel = (e)=>{
    const hasQty = e.qty!==undefined && e.qty!==null && e.qty!=="";
    return "✓ " + (hasQty ? fmtNum(e.qty)+" @ " : "") + money(e.cost) + (e.supplier ? " (" + esc(e.supplier) + ")" : "");
  };
  const issueChip = issue ? `<span style="display:inline-flex;align-items:center;gap:4px;">
      ${chip("Unable: " + issue.reason,"critical")}
      ${canManagePurchases() ? `<button class="btn" data-issue-edit="${esc(bp)}" style="padding:1px 6px;font-size:11px;">Edit</button>
      <button class="delbtn" data-issue-delete="${esc(bp)}" title="Delete this entry">✕</button>` : ""}
    </span>` : "";

  if(!canManagePurchases()){
    // read-only role (Stock Taker): show what's been bought (or why it wasn't), no way to log/edit here
    const parts = entries.map(e=> chip(lineLabel(e),"good"));
    if(issue) parts.push(chip("Unable: " + issue.reason,"critical"));
    if(!parts.length) return `<span class="helptext">—</span>`;
    return parts.join(" ");
  }

  const editingVal = shoppingBuyEditing.get(bp); // undefined = no form open; "new" = adding a line; else = id of the line being edited
  const editingExisting = (editingVal && editingVal!=="new") ? entries.find(e=>e.id===editingVal) : null;
  const issueEditing = shoppingIssueEditing.has(bp);

  const lineChips = entries.map(e=> `
    <span style="display:inline-flex;align-items:center;gap:4px;">
      ${chip(lineLabel(e),"good")}
      <button class="btn" data-buy-edit="${esc(bp)}" data-buy-edit-id="${esc(e.id||"")}" style="padding:1px 6px;font-size:11px;">Edit</button>
      <button class="delbtn" data-buy-delete-id="${esc(e.id||"")}" data-buy-delete-bp="${esc(bp)}" title="Delete this entry">✕</button>
    </span>`).join("");

  if(issueEditing){
    return `<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start;">
      ${lineChips ? `<div style="display:flex;gap:6px;flex-wrap:wrap;">${lineChips}</div>` : ""}
      <div class="buyrow" data-issue-row="${esc(bp)}" style="display:flex;align-items:center;gap:4px;white-space:nowrap;">
        <input type="text" class="issue-reason" placeholder="Reason" value="${esc(issue?issue.reason:"")}" style="width:150px;">
        <button class="btn primary" data-issue-tick="${esc(bp)}" title="Save" style="padding:2px 10px;font-size:12px;background:var(--critical);border-color:var(--critical);">✕</button>
        <button class="btn" data-issue-cancel="${esc(bp)}" style="padding:2px 6px;font-size:12px;" title="Close without saving">✕</button>
      </div>
    </div>`;
  }

  if(!editingVal){
    return `<div data-buy-row="${esc(bp)}" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
      ${lineChips}
      ${issueChip}
      <button class="btn" data-buy-addnew="${esc(bp)}" style="padding:2px 10px;font-size:12px;white-space:nowrap;">+ ${entries.length?"Add another":"Log buy"}</button>
      ${!issue ? `<button class="btn" data-issue-addnew="${esc(bp)}" style="padding:2px 10px;font-size:12px;white-space:nowrap;">+ Unable to buy</button>` : ""}
    </div>`;
  }

  const prefillQty = editingExisting && editingExisting.qty!==undefined && editingExisting.qty!==null ? editingExisting.qty : (!editingExisting && r.toBuy!==null ? r.toBuy : "");
  const prefillCost = editingExisting && editingExisting.cost!==undefined && editingExisting.cost!==null ? editingExisting.cost : "";
  const prefillSupplier = editingExisting ? (editingExisting.supplier||"") : "";
  return `<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start;">
    ${lineChips ? `<div style="display:flex;gap:6px;flex-wrap:wrap;">${lineChips}</div>` : ""}
    <div class="buyrow" data-buy-row="${esc(bp)}" data-buy-editid="${esc(editingExisting?editingVal:"")}" style="display:flex;align-items:center;gap:4px;white-space:nowrap;">
      <input type="number" step="0.01" class="buy-qty" placeholder="Qty" value="${esc(prefillQty)}" style="width:56px;">
      <input type="number" step="0.01" class="buy-cost" placeholder="Price/u" value="${esc(prefillCost)}" style="width:72px;">
      <input type="text" class="buy-supplier" placeholder="Supplier" value="${esc(prefillSupplier)}" style="width:90px;">
      <button class="btn primary" data-buy-tick="${esc(bp)}" title="Save" style="padding:2px 10px;font-size:12px;">✓</button>
      <button class="btn" data-buy-cancel="${esc(bp)}" style="padding:2px 6px;font-size:12px;" title="Close without saving">✕</button>
    </div>
  </div>`;
}

// A clickable summary tile on the Shopping List header row — clicking it sets the Status filter to
// statusValue (clicking the already-active one clears the filter back to "All statuses"), staying in
// sync with the existing Status dropdown since both read/write the same shoppingStatusFilter global.
function statBlock(label, statusValue, count, color, small){
  const active = shoppingStatusFilter === statusValue;
  return `<div class="stat clickable${active?" active":""}" data-stat-filter="${esc(statusValue)}" title="Show only ${esc(statusValue)}${active?" (click again to clear)":""}">
    <div class="label">${esc(label)}</div><div class="value${small?" small":""}" style="color:${color}">${count}</div>
  </div>`;
}

// Toggle tile: "Bought today" — how many base products have at least one purchase line logged for
// today, across any supplier. A separate dimension from status/category (a product can be Critical
// AND already bought today, e.g. a top-up is still on the way), so this ANDs with those filters
// instead of replacing them the way the status tiles replace each other.
function boughtTodayBlock(count){
  const active = shoppingBoughtTodayOnly;
  return `<div class="stat clickable${active?" active":""}" data-stat-boughttoday="1" title="Show only products with a purchase logged today${active?" (click again to clear)":""}">
    <div class="label">Bought today</div><div class="value" style="color:var(--accent)">${count}</div>
  </div>`;
}

function renderShoppingList(){
  const today = new Date().toISOString().slice(0,10);
  const hiddenCats = hiddenCategorySet();
  const all = shoppingListComputed().filter(r=> !hiddenCats.has(r.category||"Uncategorized"));
  const counts = {"Critical":0, "Buy":0, "OK":0, "Overstocked":0, "No stock take":0, "Missing setup":0};
  all.forEach(r=> counts[r.status] = (counts[r.status]||0) + 1);
  const boughtTodayCount = all.filter(r=> purchaseEntriesForDate(r.baseProduct, today).length > 0).length;

  const categories = Array.from(new Set(all.map(r=> r.category || "Uncategorized"))).sort();
  const categoryOptions = `<option value="">All categories</option>` +
    categories.map(c=>`<option value="${esc(c)}" ${c===shoppingCategoryFilter?"selected":""}>${esc(c)}</option>`).join("");

  const statusList = ["Critical","Buy","Overstocked","No stock take","Missing setup","OK"];
  const statusOptions = `<option value="">All statuses</option>` +
    statusList.map(s=>`<option value="${esc(s)}" ${s===shoppingStatusFilter?"selected":""}>${esc(s)} (${counts[s]||0})</option>`).join("");

  let rows = all;
  if(shoppingCategoryFilter) rows = rows.filter(r=> (r.category||"Uncategorized")===shoppingCategoryFilter);
  if(shoppingStatusFilter) rows = rows.filter(r=> r.status===shoppingStatusFilter);
  if(shoppingBoughtTodayOnly) rows = rows.filter(r=> purchaseEntriesForDate(r.baseProduct, today).length > 0);

  const noStockTakesYet = DATA.stockTakes.length === 0;

  const tableRows = rows.map(r=>{
    const flags = [];
    if(r.missing && r.missing!=="OK") flags.push(chip(r.missing,"neutral"));
    if(r.consistency && r.consistency!=="OK") flags.push(chip(r.consistency,"neutral"));
    return `
    <tr>
      <td>${esc(r.baseProduct)}</td>
      <td>${esc(r.category||"—")}</td>
      <td>${shoppingStatusChip(r.status)}</td>
      <td class="num">${r.currentStock!==null ? fmtNum(r.currentStock) : "—"}</td>
      <td class="helptext">${esc(r.stockDate||"—")}</td>
      <td class="num">${r.recommended!==null ? fmtNum(r.recommended,0) : "—"}</td>
      <td class="num" style="font-weight:${r.toBuy?'600':'400'};">${r.toBuy!==null ? fmtNum(r.toBuy,0) : "—"}</td>
      <td>${esc(r.procUnit||"—")}</td>
      <td>${renderBuyCell(r, today)}</td>
      <td>${flags.join(" ") || ""}</td>
    </tr>`;
  }).join("");

  return `
    <div class="pagehead">
      <div><h2>Shopping List</h2><p>Compares your most recent stock take against your Calculated Holdings target for every base product, so you can see at a glance what's critically low, what's worth buying, and what's overstocked.</p></div>
    </div>
    ${noStockTakesYet ? `<div class="banner warn">No stock takes recorded yet — log today's counts in Stock Take, then this list will show what needs buying.</div>` : ""}
    <div class="cardrow">
      ${statBlock("Critical","Critical",counts["Critical"],"var(--critical)")}
      ${statBlock("Recommended to buy","Buy",counts["Buy"],"var(--warn)")}
      ${statBlock("OK","OK",counts["OK"],"var(--good)")}
      ${statBlock("Overstocked","Overstocked",counts["Overstocked"],"var(--muted)")}
      ${boughtTodayBlock(boughtTodayCount)}
    </div>
    <div class="card">
      <div class="cardhead">
        <div><h3>Base products</h3><div class="desc">${rows.length} of ${all.length} shown, most urgent first.</div></div>
        <div class="field" style="min-width:170px;"><label>Status</label><select id="shoppingStatusFilterSel">${statusOptions}</select></div>
        <div class="field" style="min-width:170px;"><label>Category</label><select id="shoppingCategoryFilterSel">${categoryOptions}</select></div>
      </div>
      <div class="cardbody" style="padding:0;">
        <div class="tablewrap" style="border:none;border-radius:0;max-height:640px;overflow-y:auto;"><table>
          <thead><tr><th>Base product</th><th>Category</th><th>Status</th><th class="num">Current stock</th><th>Counted on</th><th class="num">Holding target</th><th class="num">Suggested buy</th><th>Unit</th><th>Bought today</th><th>Flags</th></tr></thead>
          <tbody>${tableRows || `<tr><td colspan="10" class="empty">Nothing matches this filter.</td></tr>`}</tbody>
        </table></div>
      </div>
    </div>`;
}

// % of stock on hand vs. holding target, shared by the Quick Buy list and entry screen.
// Reuses shoppingListComputed's already-computed ratio (currentStock / recommended) rather than recomputing it.
function stockPctBadge(r){
  if(r.ratio===null || r.ratio===undefined) return `<span class="helptext">—</span>`;
  const pct = Math.round(r.ratio*100);
  const kind = {"Critical":"critical","Buy":"warn","OK":"good","Overstocked":"neutral"}[r.status] || "neutral";
  return chip(pct + "% of stock", kind);
}

// ---------- Quick Buy (phone-friendly market entry) ----------
function renderQuickBuy(){
  const today = new Date().toISOString().slice(0,10);
  const hiddenCats = hiddenCategorySet();
  const all = shoppingListComputed().filter(r=> !hiddenCats.has(r.category||"Uncategorized")); // already sorted most-urgent-first
  const search = quickBuySearch.trim().toLowerCase();
  const categories = Array.from(new Set(all.map(r=> r.category || "Uncategorized"))).sort();
  const categoryOptions = `<option value="">All categories</option>` +
    categories.map(c=>`<option value="${esc(c)}" ${c===quickBuyCategoryFilter?"selected":""}>${esc(c)}</option>`).join("");
  let candidates = quickBuyCategoryFilter ? all.filter(r=> (r.category||"Uncategorized")===quickBuyCategoryFilter) : all;
  if(search) candidates = candidates.filter(r=> r.baseProduct.toLowerCase().includes(search));
  // baseProduct is required for every real entry (see distinctBaseProducts/weightedCostMap_ etc., which
  // already skip rows without one) — a stray row with a blank baseProduct cell but today's date isn't
  // actionable data, and crashed the "Logged today" sort below (localeCompare on undefined) when one
  // turned up in a real sheet, so it's filtered out here at the source rather than patched at each use.
  const todaysEntries = DATA.purchaseCosts.filter(p=> p.date===today && p.baseProduct);
  const todaysIssues = DATA.purchaseIssues.filter(p=> p.date===today && p.baseProduct);

  let bodyHtml;
  if(quickBuySelected){
    const row = all.find(r=>r.baseProduct===quickBuySelected) || {baseProduct:quickBuySelected, status:null, toBuy:null, procUnit:"", ratio:null, currentStock:null, recommended:null};
    const todaysLines = purchaseEntriesForDate(quickBuySelected, today);
    const existingIssue = unableEntryForDate(quickBuySelected, today);
    // quickBuyEditingId: null/undefined = adding a new line; else the id of a line already logged
    // today that's being corrected in place (buying the same product from two suppliers today is
    // legitimate, so picking this product again defaults to ADDING another line, not editing the first)
    const editingLine = quickBuyEditingId ? todaysLines.find(e=>e.id===quickBuyEditingId) : null;
    const prefillQty = editingLine && editingLine.qty!==undefined && editingLine.qty!==null ? editingLine.qty : (!editingLine && row.toBuy!==null && row.toBuy!==undefined ? row.toBuy : "");
    const prefillCost = editingLine && editingLine.cost!==undefined && editingLine.cost!==null ? editingLine.cost : "";
    const prefillSupplier = editingLine ? (editingLine.supplier||"") : "";
    const prefillReason = existingIssue ? existingIssue.reason : "";
    const stockLine = row.ratio!==null && row.ratio!==undefined
      ? `${Math.round(row.ratio*100)}% of target (${fmtNum(row.currentStock,0)} on hand / ${fmtNum(row.recommended,0)} target)`
      : (row.currentStock===null ? "no stock take yet" : "");

    const modeToggle = `
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <button class="btn ${quickBuyMode==='buy'?'primary':''}" data-quickbuy-setmode="buy" style="flex:1;">Log purchase</button>
        <button class="btn ${quickBuyMode==='unable'?'primary':''}" data-quickbuy-setmode="unable" style="flex:1;">Unable to purchase</button>
      </div>`;

    const todaysLinesList = todaysLines.length ? `
      <div style="margin-bottom:16px;">
        <div class="helptext" style="font-weight:600;margin-bottom:6px;">Already logged today</div>
        ${todaysLines.map(e=>{
          const hasQty = e.qty!==undefined && e.qty!==null && e.qty!=="";
          const label = (hasQty ? fmtNum(e.qty)+" @ " : "") + money(e.cost) + (e.supplier ? " (" + esc(e.supplier) + ")" : "");
          return `<div class="quickbuylogrow">
            <span>${label}</span>
            <span style="display:flex;align-items:center;gap:10px;">
              <button class="btn small" data-quickbuy-edit-line="${esc(e.id||"")}">Edit</button>
              <button class="delbtn" data-quickbuy-delete-id="${esc(e.id||"")}" title="Delete this entry">✕</button>
            </span>
          </div>`;
        }).join("")}
      </div>` : "";

    const buyForm = `
      <div class="formgrid">
        <div class="field"><label>Quantity</label><input type="number" inputmode="decimal" step="0.01" id="quickBuyQty" value="${esc(prefillQty)}" style="font-size:20px;padding:13px;"></div>
        <div class="field"><label>Price per unit</label><input type="number" inputmode="decimal" step="0.01" id="quickBuyCost" value="${esc(prefillCost)}" style="font-size:20px;padding:13px;" placeholder="e.g. 85.00"></div>
        <div class="field"><label>Supplier</label><input type="text" id="quickBuySupplier" value="${esc(prefillSupplier)}" style="font-size:20px;padding:13px;" placeholder="optional"></div>
      </div>
      <button class="btn primary" id="quickBuyConfirm" style="width:100%;font-size:16px;padding:15px;margin-top:14px;">${editingLine ? "✓ Save changes" : "✓ Confirm purchase"}</button>`;

    const unableForm = `
      <div class="field">
        <label>Reason</label>
        <input type="text" id="quickBuyReason" value="${esc(prefillReason)}" placeholder="e.g. out of season, quality not up to standard" style="font-size:16px;padding:13px;">
      </div>
      <button class="btn primary" id="quickBuyLogUnable" style="width:100%;font-size:16px;padding:15px;margin-top:14px;background:var(--critical);border-color:var(--critical);">✕ Log as unable to purchase</button>`;

    bodyHtml = `
      <div class="card">
        <div class="cardbody">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px;">
            <div>
              <div style="font-size:21px;font-weight:700;line-height:1.3;">${esc(row.baseProduct)}</div>
              <div class="helptext" style="margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                ${esc(row.procUnit||"")}
                ${row.status ? shoppingStatusChip(row.status) : ""}
                ${stockLine ? `<span>${esc(stockLine)}</span>` : ""}
                ${row.toBuy!==null && row.toBuy!==undefined ? `<span>suggested buy: ${fmtNum(row.toBuy,0)}</span>` : ""}
              </div>
            </div>
            <button class="btn" id="quickBuyBack">← Back</button>
          </div>
          ${quickBuyMode==='buy' ? todaysLinesList : ""}
          ${modeToggle}
          ${quickBuyMode==='unable' ? unableForm : buyForm}
        </div>
      </div>`;
  } else {
    // once a product's been bought (or logged as unable to purchase) today, sink it out of the
    // urgency-ordered pick list so the top of the list always reflects what's still outstanding —
    // but keep it visible (dimmed, with what was logged) rather than hiding it, so nothing gets
    // double-bought or forgotten about.
    const loggedTodaySet = new Set([...todaysEntries.map(p=>p.baseProduct), ...todaysIssues.map(p=>p.baseProduct)]);
    const pending = candidates.filter(r=> !loggedTodaySet.has(r.baseProduct));
    const done = candidates.filter(r=> loggedTodaySet.has(r.baseProduct));

    const doneBadge = (r)=>{
      const lines = purchaseEntriesForDate(r.baseProduct, today);
      if(lines.length===1){
        const hasQty = lines[0].qty!==undefined && lines[0].qty!==null && lines[0].qty!=="";
        return chip("✓ " + (hasQty ? fmtNum(lines[0].qty)+" @ " : "") + money(lines[0].cost), "good");
      }
      if(lines.length>1) return chip("✓ " + lines.length + " buys logged", "good");
      const issue = unableEntryForDate(r.baseProduct, today);
      if(issue) return chip("✕ " + issue.reason, "critical");
      return "";
    };

    const pendingButtons = pending.slice(0,60).map(r=>`
      <button class="quickbuyitem" data-quickbuy-pick="${esc(r.baseProduct)}">
        <span class="qb-name">${esc(r.baseProduct)}</span>
        <span class="qb-meta">
          ${stockPctBadge(r)}
          ${r.status ? shoppingStatusChip(r.status) : ""}
        </span>
      </button>`).join("");

    const doneButtons = done.map(r=>`
      <button class="quickbuyitem" data-quickbuy-pick="${esc(r.baseProduct)}" style="opacity:0.55;">
        <span class="qb-name">${esc(r.baseProduct)}</span>
        <span class="qb-meta">${doneBadge(r)}</span>
      </button>`).join("");

    bodyHtml = `
      <div class="card">
        <div class="cardbody">
          <div class="formgrid" style="margin-bottom:12px;">
            <div class="field"><label>Category</label><select id="quickBuyCategoryFilterSel">${categoryOptions}</select></div>
          </div>
          <input type="text" id="quickBuySearchInput" placeholder="Search a product…" value="${esc(quickBuySearch)}" style="font-size:16px;padding:13px;margin-bottom:12px;">
          <div class="quickbuylist">${pendingButtons || (done.length ? `<div class="empty">Everything in this filter is logged for today ✓</div>` : `<div class="empty">No products match this filter.</div>`)}</div>
          ${pending.length>60 ? `<div class="helptext" style="margin-top:10px;">${pending.length-60} more still to buy — keep typing to narrow it down.</div>` : ""}
          ${done.length ? `
            <div class="helptext" style="margin:16px 0 8px;font-weight:600;">Already logged today (${done.length})</div>
            <div class="quickbuylist">${doneButtons}</div>
          ` : ""}
        </div>
      </div>`;
  }

  // One row PER PURCHASE LINE (not per base product) — buying the same product from two suppliers
  // today means two rows here, each independently editable/deletable by its own id.
  const loggedRows = [
    ...todaysEntries.map(p=>({type:"purchase", baseProduct:p.baseProduct, entry:p})),
    ...todaysIssues.map(p=>({type:"issue", baseProduct:p.baseProduct, entry:p})),
  ].sort((a,b)=> a.baseProduct.localeCompare(b.baseProduct) || (a.entry.supplier||"").localeCompare(b.entry.supplier||""));

  const loggedHtml = loggedRows.length ? loggedRows.map(({type,baseProduct,entry})=>{
    if(type==="purchase"){
      const hasQty = entry.qty!==undefined && entry.qty!==null && entry.qty!=="";
      return `
      <div class="quickbuylogrow">
        <span>${esc(baseProduct)}${entry.supplier ? ` <span class="helptext">(${esc(entry.supplier)})</span>` : ""}</span>
        <span style="display:flex;align-items:center;gap:10px;">
          <span class="num">${hasQty ? fmtNum(entry.qty)+" @ " : ""}${money(entry.cost)}</span>
          <button class="btn small" data-quickbuy-edit-purchase="${esc(baseProduct)}" data-quickbuy-edit-id="${esc(entry.id||"")}">Edit</button>
          <button class="delbtn" data-quickbuy-delete-id="${esc(entry.id||"")}" title="Delete this entry">✕</button>
        </span>
      </div>`;
    }
    return `
    <div class="quickbuylogrow">
      <span>${esc(baseProduct)}</span>
      <span style="display:flex;align-items:center;gap:10px;">
        ${chip("Unable: " + entry.reason, "critical")}
        <button class="btn small" data-quickbuy-edit-issue="${esc(baseProduct)}">Edit</button>
        <button class="delbtn" data-quickbuy-delete-issue="${esc(baseProduct)}" title="Delete this entry">✕</button>
      </span>
    </div>`;
  }).join("") : `<div class="empty">Nothing logged yet today.</div>`;

  return `
    <div class="pagehead">
      <div><h2>Quick Buy</h2><p>Fast purchase entry for the market — search a product, enter what you bought (or why you couldn't), confirm. Saves straight to Purchase Costs.</p></div>
    </div>
    ${bodyHtml}
    <div class="card">
      <div class="cardhead"><h3>Logged today</h3><div class="desc">${esc(today)} — ${todaysEntries.length} ${todaysEntries.length===1?"purchase":"purchases"}, ${todaysIssues.length} unable to purchase</div></div>
      <div class="cardbody">${loggedHtml}</div>
    </div>`;
}

// ---------- Shopping List Archive ----------
// A day-by-day historical record: each row is exactly what the live Shopping List said at snapshot
// time (see Code.gs's snapshotShoppingListToday, which runs once a day via a time-based trigger), not
// a live recalculation — so it stays accurate even after settings (safety buffers, cycle lengths) are
// changed later. Purchases/"unable to purchase" for that date are read live from DATA.purchaseCosts/
// purchaseIssues — those are already dated and permanent, no separate archiving needed for them.
function renderShoppingArchive(){
  const dates = DATA.shoppingListSnapshotDates || [];
  const dateOptions = dates.length
    ? `<option value="">Select a date…</option>` + dates.map(d=>`<option value="${esc(d)}" ${d===shoppingArchiveDate?"selected":""}>${esc(d)}</option>`).join("")
    : `<option value="">No snapshots yet</option>`;

  let bodyHtml;
  if(!dates.length){
    bodyHtml = `<div class="banner warn">No archived Shopping Lists yet. This fills in automatically once a day — see the "ONE-TIME SETUP" note above setupDailyShoppingListSnapshotTrigger in Code.gs if that hasn't been set up yet. The first entry appears the day after it's installed.</div>`;
  } else if(!shoppingArchiveDate){
    bodyHtml = `<div class="empty">Pick a date above to see that day's Shopping List.</div>`;
  } else if(shoppingArchiveError){
    bodyHtml = `<div class="banner warn">${esc(shoppingArchiveError)}</div>`;
  } else if(shoppingArchiveRows===null){
    bodyHtml = `<div class="empty">Loading…</div>`;
  } else {
    const hasNum = v=> v!==undefined && v!==null && v!=="";
    const tableRows = shoppingArchiveRows.map(r=>{
      const purchases = purchaseEntriesForDate(r.baseProduct, shoppingArchiveDate);
      const issue = unableEntryForDate(r.baseProduct, shoppingArchiveDate);
      const parts = purchases.map(e=>{
        const hasQty = hasNum(e.qty);
        return chip("✓ " + (hasQty ? fmtNum(e.qty)+" @ " : "") + money(e.cost) + (e.supplier ? " ("+esc(e.supplier)+")" : ""), "good");
      });
      if(issue) parts.push(chip("Unable: " + issue.reason, "critical"));
      return `
      <tr>
        <td>${esc(r.baseProduct)}</td>
        <td>${esc(r.category||"—")}</td>
        <td>${shoppingStatusChip(r.status)}</td>
        <td class="num">${hasNum(r.currentStock) ? fmtNum(r.currentStock) : "—"}</td>
        <td class="helptext">${esc(r.stockDate||"—")}</td>
        <td class="num">${hasNum(r.recommended) ? fmtNum(r.recommended,0) : "—"}</td>
        <td class="num">${hasNum(r.toBuy) ? fmtNum(r.toBuy,0) : "—"}</td>
        <td>${esc(r.procUnit||"—")}</td>
        <td>${parts.join(" ") || `<span class="helptext">—</span>`}</td>
      </tr>`;
    }).join("");
    bodyHtml = `
    <div class="card">
      <div class="cardhead"><div><h3>${esc(shoppingArchiveDate)}</h3><div class="desc">${shoppingArchiveRows.length} product(s) — exactly as the Shopping List stood that evening, not recalculated with today's settings.</div></div></div>
      <div class="cardbody" style="padding:0;">
        <div class="tablewrap" style="border:none;border-radius:0;max-height:640px;overflow-y:auto;"><table>
          <thead><tr><th>Base product</th><th>Category</th><th>Status</th><th class="num">Stock that day</th><th>Counted on</th><th class="num">Holding target</th><th class="num">Suggested buy</th><th>Unit</th><th>Purchases that day</th></tr></thead>
          <tbody>${tableRows || `<tr><td colspan="9" class="empty">No products recorded for this date.</td></tr>`}</tbody>
        </table></div>
      </div>
    </div>`;
  }

  return `
    <div class="pagehead">
      <div><h2>Shopping List Archive</h2><p>A day-by-day record of the Shopping List, captured automatically once a day — exactly what it said at the time, including what was bought or marked unable to purchase, so you can look back at any past date.</p></div>
      <div class="actions">
        <div class="field" style="min-width:200px;"><label>Date</label><select id="shoppingArchiveDateSel">${dateOptions}</select></div>
      </div>
    </div>
    ${bodyHtml}`;
}

// ---------- Dashboard / Procurement Plan ----------
function renderDashboard(){
  const allRows = procurementPlanComputed();
  const flagged = allRows.filter(r=>r.consistency!=="OK" || r.missing!=="OK").length;
  const tracked = allRows.length;
  const cm = DATA.procurementPlan.coverMultiplier;
  const sb = DATA.procurementPlan.safetyBuffer;
  const hw = demandHistoryWindow();
  const historyPeriods = DATA.salesHistory.length;
  const critPct = Number(DATA.shoppingList.criticalPct)||0.25;
  const overPct = Number(DATA.shoppingList.overstockPct)||1.5;

  const categories = Array.from(new Set(allRows.map(r=> r.category || "Uncategorized"))).sort();

function renderRecipes(){
  const totals = recipeCompositeTotals();
  const derived = itemSetupDerived();
  const qtyMap = {}; derived.forEach(it=>qtyMap[it.item]=it.combinedQty);
  const itemTexts = allItemTexts();
  const mixCosts = compositeMixCosts();

  const rows = DATA.recipes.map((rec,i)=>{
    const compQty = qtyMap[rec.compositeItem] || 0;
    const factor = (rec.percent!==null && rec.percent!==undefined && rec.percent!=="") ? Number(rec.percent) : (Number(rec.fixedQty)||0);
    const req = round2(compQty*factor);
    const compOk = DATA.itemSetup.some(it=>it.item===rec.compositeItem);
    const ingOk = DATA.itemSetup.some(it=>it.item===rec.ingredientItem);
    const pctTotal = totals[rec.compositeItem];
    let pctCheck = "—";
    if(rec.percent!==null && rec.percent!==undefined && rec.percent!=="" && pctTotal!==undefined){
      pctCheck = Math.abs(pctTotal-1)<0.001 ? "OK - 100%" : ("Check - totals "+Math.round(pctTotal*100)+"%");
    }
    return `<tr>
      <td><input class="rowinput" data-recidx="${i}" data-field="compositeItem" value="${esc(rec.compositeItem)}" list="itemsDL">${compOk?"":chip("not found","critical")}</td>
      <td><input class="rowinput" data-recidx="${i}" data-field="ingredientItem" value="${esc(rec.ingredientItem)}" list="itemsDL">${ingOk?"":chip("not found","critical")}</td>
      <td><input class="rowinput num" data-recidx="${i}" data-field="percent" value="${rec.percent!==null&&rec.percent!==undefined&&rec.percent!==""?round2(rec.percent*100):""}" placeholder="%" style="max-width:80px;"></td>
      <td><input class="rowinput num" data-recidx="${i}" data-field="fixedQty" value="${rec.fixedQty!==null&&rec.fixedQty!==undefined&&rec.fixedQty!==""?rec.fixedQty:""}" placeholder="qty" style="max-width:90px;"></td>
      <td class="num">${fmtNum(req)}</td>

      <td><button class="delbtn" data-del-recipe="${i}" title="Remove row">✕</button></td>

  const mixCostRows = mixCosts.map(m=>{
    const made = m.breakdown.map(b=>{
      const label = b.isPercent ? (Math.round(b.factor*100)+"%") : ("×"+fmtNum(b.factor,4));

    }).join(", ");
    return `<tr>
      <td>${esc(m.compositeItem)}</td>
      <td class="num" style="font-weight:600;">${m.cost!==null ? money(m.cost) : "—"}</td>
      <td class="helptext">${made || "—"}${m.complete?"":` ${chip("Incomplete — missing an ingredient cost","critical")}`}</td>

  return `
    <div class="pagehead">

        <div class="tablewrap" style="border:none;border-radius:0;">

          <div class="field"><label>OR fixed qty per unit</label><input type="number" step="0.0001" id="newRecFixed" placeholder="e.g. 0.05"></div>
          <div><button class="btn primary" id="addRecipeRow">Add line</button></div>

// Which recent days have had an Item Sales report submitted for them, so a missed day is easy to
// spot at a glance rather than discovered later as an unexplained gap in Calculated Holdings' averages.
const UPLOAD_COVERAGE_WINDOW = 30;
function renderUploadCoverage(){
  const uploaded = new Set(DATA.salesHistory.map(h=>h.date));
  const today = new Date().toISOString().slice(0,10);
  const DOW = ["Su","Mo","Tu","We","Th","Fr","Sa"];
  const days = [];
  for(let i=UPLOAD_COVERAGE_WINDOW-1;i>=0;i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    days.push({iso:d.toISOString().slice(0,10), dow:DOW[d.getDay()], num:d.getDate()});
  }
  const missing = days.filter(d=> d.iso<today && !uploaded.has(d.iso)).map(d=>d.iso);
  const cells = days.map(d=>{
    let status = "pending", label = "Today — not yet uploaded";
    if(uploaded.has(d.iso)){ status = "done"; label = "Uploaded"; }
    else if(d.iso<today){ status = "missing"; label = "Missing — no report submitted"; }
    return `<div class="covday ${status}" title="${esc(d.iso)}: ${label}"><span class="dow">${d.dow}</span><span class="num">${d.num}</span></div>`;
  }).join("");
  const shown = missing.slice(-6).map(esc).join(", ");
  const summary = missing.length
    ? `${chip(missing.length + " missing", "critical")} ${shown}${missing.length>6 ? " and " + (missing.length-6) + " more" : ""}`
    : chip("No gaps in the last " + UPLOAD_COVERAGE_WINDOW + " days", "good");
  return `
    <div class="card">
      <div class="cardhead"><div><h3>Upload history</h3><div class="desc">Last ${UPLOAD_COVERAGE_WINDOW} days — green means a report was submitted for that date, red means none was. Hover a day for the exact date.</div></div></div>
      <div class="cardbody">
        <div class="covgrid">${cells}</div>
        <div class="helptext" style="margin-top:10px;">${summary}</div>
      </div>
    </div>`;
}
